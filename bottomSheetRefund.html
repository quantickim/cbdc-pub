<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
  </head>
  <body class="KBB">
    <!-- 바텀시트 딤 오버레이 -->
    <div class="bottom-sheet-overlay active">
      <div class="bottom-sheet-container">
        <!-- 상단 헤더 (타이틀 + 닫기 버튼) -->
        <div class="bottom-sheet-header">
          <h3 class="bottom-sheet-title">환불하시겠습니까?</h3>
          <button type="button" class="btn-sheet-close" aria-label="닫기"></button>
        </div>

        <!-- 본문 콘텐츠 -->
        <div class="bottom-sheet-content">
          <!-- 환불총액 영역 -->
          <div class="refund-total-wrapper">
            <span class="refund-total-label">환불총액</span>
            <div class="refund-total-amount">
              <span class="amount-value">20,500</span>
              <span class="amount-unit">원</span>
            </div>
          </div>

          <!-- 상세 정보 리스트 -->
          <div class="refund-info-list">
            <div class="refund-info-item">
              <span class="refund-info-label">사용처</span>
              <span class="refund-info-value">스피카 나폴리 합정</span>
            </div>
            <div class="refund-info-item">
              <span class="refund-info-label">결제 일시</span>
              <span class="refund-info-value">24.07.29 20:49:51</span>
            </div>
          </div>

          <!-- 안내문구 유틸리티 리스트 -->
          <ul class="refund-notice-list">
            <li>
              <i class="icon-notice-bullet" aria-hidden="true"></i>
              <span>바우처를 사용하여 결제한 금액은 동일한 바우처로 환불됩니다.</span>
            </li>
            <li>
              <i class="icon-notice-bullet" aria-hidden="true"></i>
              <span>결제일 기중 7일 이내에 결제한 사용처를 직접 방문하여 환불 할 수 있습니다.</span>
            </li>
            <li>
              <i class="icon-notice-bullet" aria-hidden="true"></i>
              <span
                >캐시백 환급 금액을 차정한 예금 토큰이 환불되며, 사용하신 캐시백 상품권은 환불 완료 후 복구됩니다.</span
              >
            </li>
          </ul>
        </div>

        <!-- 하단 2버튼 영역 -->
        <div class="bottom-sheet-footer">
          <button type="button" class="btn-sheet-cancel">취소</button>
          <button type="button" class="btn-sheet-confirm">환불하기</button>
        </div>
      </div>
    </div>
  </body>
</html>
