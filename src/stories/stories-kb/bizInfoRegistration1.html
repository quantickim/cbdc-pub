<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
  </head>
  <body class="KBB">
    <div class="page-business-register-KBB has-fixed-bottom">
      <!-- 상단 공통 헤더 -->
      <header class="common-header">
        <button type="button" class="btn-go-main">전자지갑 메인</button>
      </header>

      <main class="business-register-main">
        <!-- 타이틀 & 안내 문구 -->
        <section class="business-register-title-container">
          <h2 class="page-title">사업자 정보를 입력해주세요</h2>
        </section>

        <!-- 안내 문구 (회색 박스, bizInfoRegistration2 와 같은 스타일) -->
        <section class="business-register-guide-box">
          <ul class="guide-list">
            <li class="guide-item">개인사업자만 등록할 수 있습니다.</li>
            <li class="guide-item">사업자는 현금영수증을 발행할 수 있습니다.</li>
          </ul>
        </section>

        <!-- 사업자번호 입력 폼 -->
        <section class="business-register-form-container">
          <div class="form-item">
            <label class="form-label" for="bizNum1">사업자등록번호</label>
            <div class="business-number-inputs">
              <div class="input-item common-input-field flex-1">
                <input
                  type="text"
                  inputmode="numeric"
                  id="bizNum1"
                  class="common-form-input"
                  placeholder="3자리 입력"
                  maxlength="3"
                  value="111"
                />
              </div>
              <div class="input-item common-input-field flex-2">
                <input
                  type="text"
                  inputmode="numeric"
                  id="bizNum2"
                  class="common-form-input"
                  placeholder="2자리 입력"
                  maxlength="2"
                  value="222"
                />
              </div>
              <div class="input-item common-input-field flex-3">
                <input
                  type="text"
                  inputmode="numeric"
                  id="bizNum3"
                  class="common-form-input"
                  placeholder="5자리 입력"
                  maxlength="5"
                  value="34567"
                />
              </div>
            </div>
            <!-- 미입력·오입력 시 오류 문구 (다음 버튼을 누르면 노출) -->
            <div class="common-error-message">
              <i class="icon-warning-red" aria-hidden="true"></i>
              <span class="error-text">사업자등록번호를 확인해주세요.</span>
            </div>
          </div>
        </section>
      </main>

      <!-- 하단 고정 버튼 -->
      <div class="fixed-bottom-dual-btn-wrapper">
        <button type="button" class="btn-dual-sub">취소</button>
        <button type="button" class="btn-dual-main">다음</button>
      </div>
    </div>
  </body>
</html>
