<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
  </head>
  <body class="KBB">
    <div class="page-business-register-KBB has-fixed-bottom">
      <!-- 상단 공통 헤더 -->
      <header class="common-header">
        <button type="button" class="btn-go-main">메인으로</button>
      </header>

      <main class="business-register-main">
        <!-- 타이틀 & 안내 문구 -->
        <section class="business-register-title-container">
          <h2 class="page-title">사업자 정보 등록</h2>
          <p class="page-desc">
            개인사업자만 등록 가능합니다.<br />
            사업자 정보 등록 시 현금영수증 발행이 가능합니다.
          </p>
        </section>

        <!-- 사업자번호 입력 폼 -->
        <section class="business-register-form-container">
          <div class="form-item">
            <label class="form-label" for="bizNum1">사업자등록번호</label>
            <div class="business-number-inputs">
              <div class="input-item common-input-field flex-1">
                <input
                  type="text"
                  inputmode="numeric"
                  id="bizNum1"
                  class="common-form-input"
                  placeholder="3자리"
                  maxlength="3"
                  value="111"
                />
              </div>
              <div class="input-item common-input-field flex-2">
                <input
                  type="text"
                  inputmode="numeric"
                  id="bizNum2"
                  class="common-form-input"
                  placeholder="2자리"
                  maxlength="2"
                  value="222"
                />
              </div>
              <div class="input-item common-input-field flex-3">
                <input
                  type="text"
                  inputmode="numeric"
                  id="bizNum3"
                  class="common-form-input"
                  placeholder="5자리"
                  maxlength="5"
                  value="34567"
                />
              </div>
            </div>
          </div>
        </section>
      </main>

      <!-- 하단 고정 버튼 -->
      <div class="fixed-bottom-btn-wrapper">
        <button type="button" class="btn-confirm-bottom">다음</button>
      </div>
    </div>
  </body>
</html>
