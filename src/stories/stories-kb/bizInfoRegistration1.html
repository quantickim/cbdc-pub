<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/common.css" />
    <link rel="stylesheet" href="../../shared/assets/styles/style.css" />
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
  </head>
  <body class="KBB">
    <div class="page-business-register-KBB has-fixed-bottom">
      <main class="business-register-main">
        <header class="common-header">
          <button type="button" class="btn-go-main">메인으로</button>
        </header>
        <!-- 타이틀 & 안내 문구 -->
        <section class="business-register-title-container">
          <h2 class="page-title">사업자 정보 등록</h2>
          <p class="page-desc">
            개인사업자만 등록 가능합니다.<br />
            사업자 정보 등록 시 현금영수증 발행이 가능합니다.
          </p>
        </section>

        <!-- 사업자번호 입력 폼 -->
        <section class="business-register-form-container">
          <div class="form-item">
            <label class="form-label" for="bizNum1">사업자등록번호</label>
            <div class="business-number-inputs">
              <div class="input-item">
                <input
                  type="number"
                  inputmode="numeric"
                  id="bizNum1"
                  class="input-underline"
                  placeholder="3자리"
                  maxlength="3"
                  oninput="if(this.value.length > 3) this.value = this.value.slice(0, 3);"
                />
              </div>
              <div class="input-item">
                <input
                  type="number"
                  inputmode="numeric"
                  id="bizNum2"
                  class="input-underline"
                  placeholder="2자리"
                  maxlength="2"
                  oninput="if(this.value.length > 2) this.value = this.value.slice(0, 2);"
                />
              </div>
              <div class="input-item flex-2">
                <input
                  type="number"
                  inputmode="numeric"
                  id="bizNum3"
                  class="input-underline"
                  placeholder="5자리"
                  maxlength="5"
                  oninput="if(this.value.length > 5) this.value = this.value.slice(0, 5);"
                />
              </div>
            </div>
          </div>
        </section>
      </main>

      <!-- 하단 고정 버튼 -->
      <div class="fixed-bottom-btn-wrapper">
        <button type="button" class="btn-confirm-bottom">다음</button>
      </div>
    </div>
  </body>
</html>
