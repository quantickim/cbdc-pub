<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/common.css" />
    <link rel="stylesheet" href="../../shared/assets/styles/style.css" />
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
  </head>
  <body class="KBB">
    <!-- 중앙 얼럿 팝업 딤 오버레이 -->
    <div class="modal-dialog-overlay active">
      <div class="modal-dialog-container">
        <!-- 본문 콘텐츠 -->
        <div class="modal-dialog-content">
          <h3 class="modal-dialog-title">사업자 정보 변경</h3>
          <div class="modal-dialog-description">
            <p>사업자 정보를 변경하시겠습니까?</p>
            <br />
            <p>사업자등록번호 변경 시<br />기존 송금 완료 건에 대해서는<br />현금영수증 발급/취소가 불가능합니다.</p>
          </div>
        </div>

        <!-- 하단 버튼 영역 (취소 / 변경) -->
        <div class="modal-dialog-footer">
          <button type="button" class="btn-modal-cancel">취소</button>
          <button type="button" class="btn-modal-confirm">변경</button>
        </div>
      </div>
    </div>
  </body>
</html>
