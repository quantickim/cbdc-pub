<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
    <script type="text/javascript" src="../../shared/assets/js/js-kb/app.js"></script>
  </head>
  <body class="KBB">
    <div class="page-verification-KBB">
      <header class="common-header">
        <button type="button" class="btn-go-main">메인으로</button>
      </header>
      <main class="main-content">
        <!-- 메인 타이틀 섹션 -->
        <section class="verification-title-container">
          <h2 class="verification-main-title">
            계좌비밀번호<br />
            4자리를 입력해 주세요
          </h2>
        </section>

        <!-- 계좌비밀번호 입력 섹션 -->
        <section class="verification-form-container">
          <div class="form-group-item">
            <div class="common-input-field" id="accountPasswordField">
              <input
                type="password"
                id="accountPassword"
                class="common-form-input"
                maxlength="4"
                inputmode="numeric"
                autocomplete="new-password"
                aria-label="계좌비밀번호 4자리"
              />
              <!-- 자리수 안내용 점 (입력 시작하면 숨김) -->
              <span class="password-placeholder-dots" aria-hidden="true">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
              </span>
            </div>
          </div>
        </section>
      </main>

      <!-- 하단 고정 단일 버튼 (입력 전에는 비활성) -->
      <div class="fixed-bottom-btn-wrapper">
        <button type="button" class="btn-confirm-bottom disabled" id="btnVerifyNext" disabled>다음</button>
      </div>
    </div>
  </body>
</html>
