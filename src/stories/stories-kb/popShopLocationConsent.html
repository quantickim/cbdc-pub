<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
  </head>
  <body class="KBB">
    <!-- 중앙 얼럿 팝업 딤 오버레이 -->
    <div class="modal-dialog-overlay active">
      <div class="modal-dialog-container">
        <!-- 본문 콘텐츠 -->
        <div class="modal-dialog-content">
          <h3 class="modal-dialog-title">위치 조회 동의</h3>
          <div class="modal-dialog-description">
            <p>바우처 사용처를 더 정확히 제공하기 위해</p>
            <p>예금 토큰 전자지갑에서 내 위치에 액세스 하</p>
            <p>도록 허용하시겠습니까?</p>
          </div>
        </div>

        <!-- 하단 버튼 영역 (취소 / 확인) -->
        <div class="modal-dialog-footer">
          <button type="button" class="btn-modal-cancel">허용안함</button>
          <button type="button" class="btn-modal-confirm">허용</button>
        </div>
      </div>
    </div>
  </body>
</html>
