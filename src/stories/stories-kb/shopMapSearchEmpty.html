<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
    <script type="text/javascript" src="../../shared/assets/js/js-kb/app.js"></script>
  </head>
  <body class="KBB">
    <div class="page-merchant-KBB page-merchant-map-mode">
      <!-- 상단 공통 헤더 -->
      <header class="common-header">
        <button type="button" class="btn-go-main">메인으로</button>
      </header>

      <main class="main-content">
        <!-- 검색 입력 영역 -->
        <section class="merchant-search-section">
          <div class="common-input-field merchant-search-field">
            <input
              type="text"
              class="common-form-input"
              placeholder="이름, 업종을 검색해보세요"
              aria-label="사용처 이름 또는 업종 검색"
              value="파리"
            />
            <button type="button" class="btn-search-action" aria-label="검색">
              <i class="icon-search-black" aria-hidden="true"></i>
            </button>
          </div>
        </section>

        <!-- 현재 위치 & 목록 보기 전환 버튼 영역 -->
        <section class="merchant-location-section">
          <div class="location-current-wrapper">
            <i class="icon-current-location" aria-hidden="true"></i>
            <span class="location-text">서울 영등포구 여의동</span>
          </div>
          <!-- 리스트 뷰 전환 버튼 (목록 아이콘) -->
          <button type="button" class="btn-list-view" aria-label="목록형으로 보기">
            <i class="icon-view-list" aria-hidden="true"></i>
          </button>
        </section>

        <!-- 지도 뷰 영역 -->
        <section class="merchant-map-container">
          <!-- 실제 지도 영역 (네이버/카카오/구글 맵 인스턴스 영역) -->
          <div class="map-view-canvas" id="merchantMap">
            <!-- 지도 배경 시뮬레이션용 플레이스홀더 (실제 맵 연동 시 대체) -->
            <div class="map-dummy-background"></div>

            <!-- 현재 내 위치 표시 핀 (파란 원) -->
            <div class="map-current-my-location" style="top: 48%; left: 63%">
              <div class="location-ripple"></div>
              <div class="location-core-dot"></div>
            </div>

            <!-- 좌하단 플로팅 컨트롤 버튼 (내 위치, 정보) -->
            <div class="map-floating-controls-left">
              <button type="button" class="btn-map-circle-action" aria-label="현재 위치로 이동">
                <i class="icon-location-gps" aria-hidden="true"></i>
              </button>
              <button type="button" class="btn-map-circle-action" aria-label="지도 안내 정보">
                <i class="icon-info-circle-outline" aria-hidden="true"></i>
              </button>
            </div>

            <!-- 우하단 '이 지역에서 검색' 플로팅 캡슐 버튼 -->
            <div class="map-floating-action-right">
              <button type="button" class="btn-search-this-area">
                <i class="icon-refresh-white" aria-hidden="true"></i>
                <span>이 지역에서 검색</span>
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
