<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <title>CBDC - 카테고리를 선택</title>
    <link rel="stylesheet" href="../../shared/assets/styles/common.css" />
    <link rel="stylesheet" href="../../shared/assets/styles/style.css" />
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
    <script type="text/javascript" src="../../shared/assets/js/js-kb/app.js"></script>
  </head>
  <body class="KBB">
    <!-- 전용 네임스페이스 클래스: sheet-inquiry-category 추가 -->
    <div class="bottom-sheet-overlay sheet-inquiry-category" role="dialog" aria-modal="true">
      <div class="bottom-sheet-container">
        <!-- 상단 헤더 -->
        <div class="bottom-sheet-header">
          <h2 class="bottom-sheet-title">카테고리를 선택</h2>
          <button type="button" class="btn-sheet-close" aria-label="닫기"></button>
        </div>

        <!-- 바텀시트 본문 (선택 메뉴 리스트) -->
        <div class="bottom-sheet-content">
          <ul class="select-menu-list">
            <li class="select-menu-item">
              <button type="button" class="btn-menu-link">가입/변경/탈퇴</button>
            </li>
            <li class="select-menu-item">
              <button type="button" class="btn-menu-link">서비스이용</button>
            </li>
            <li class="select-menu-item">
              <button type="button" class="btn-menu-link">지갑/토큰</button>
            </li>
            <li class="select-menu-item">
              <button type="button" class="btn-menu-link">결제/송금/충전</button>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </body>
</html>
