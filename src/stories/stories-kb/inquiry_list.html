<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>CBDC - 1:1 문의하기</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
    <script type="text/javascript" src="../../shared/assets/js/js-kb/app.js"></script>
  </head>
  <body class="page-inquiry-list-KBB KBB">
    <!-- 공통 헤더 규격 -->
    <header>
      <div class="common-header">
        <button type="button" class="btn-go-main">메인으로</button>
      </div>
    </header>

    <main>
      <!-- 문의 내역 리스트 -->
      <section class="inquiry-list-container">
        <ul class="inquiry-list">
          <!-- 1. 답변완료 -->
          <li class="inquiry-item" data-href="inquiry_detail.html">
            <div class="item-content">
              <span class="common-badge badge-status-done">답변완료</span>
              <strong class="inquiry-title">[서비스 이용] 지갑이 뭐에요?</strong>
              <span class="inquiry-date common-font-roboto">2026.06.12</span>
            </div>
            <button type="button" class="btn-arrow" aria-label="상세보기"></button>
          </li>

          <!-- 2. 준비중 -->
          <li class="inquiry-item" data-href="inquiry_detail.html">
            <div class="item-content">
              <span class="common-badge badge-status-wait">준비중</span>
              <strong class="inquiry-title">[가입/변경/탈퇴] 토큰이 뭐에요?</strong>
              <span class="inquiry-date common-font-roboto">2026.06.15</span>
            </div>
            <button type="button" class="btn-arrow" aria-label="상세보기"></button>
          </li>

          <!-- 3. 상태 -->
          <li class="inquiry-item" data-href="inquiry_detail.html">
            <div class="item-content">
              <span class="common-badge badge-status-wait">상태</span>
              <strong class="inquiry-title">[카테고리명]제목</strong>
              <span class="inquiry-date common-font-roboto">2026.06.15</span>
            </div>
            <button type="button" class="btn-arrow" aria-label="상세보기"></button>
          </li>

          <!-- 4. 준비중 -->
          <li class="inquiry-item" data-href="inquiry_detail.html">
            <div class="item-content">
              <span class="common-badge badge-status-wait">준비중</span>
              <strong class="inquiry-title">[지갑/토큰] 탈퇴는 어떻게 하나요?</strong>
              <span class="inquiry-date common-font-roboto">2026.06.15</span>
            </div>
            <button type="button" class="btn-arrow" aria-label="상세보기"></button>
          </li>
        </ul>
      </section>
    </main>

    <!-- 공통 하단 고정 버튼 영역 -->
    <div class="fixed-bottom-btn-wrapper">
      <button type="button" class="btn-confirm-bottom" data-href="inquiry_write.html">새로운 문의 작성하기</button>
    </div>
  </body>
</html>
