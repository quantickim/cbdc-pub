<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
    <script type="text/javascript" src="../../shared/assets/js/js-kb/app.js"></script>
  </head>
  <body class="KBB">
    <div class="page-password-KBB">
      <!-- 상단 공통 헤더 -->
      <header>
        <div class="common-header">
          <button type="button" class="btn-go-main">메인으로</button>
        </div>
      </header>

      <main class="main-content">
        <!-- 타이틀 & 안내 문구 섹션 -->
        <section class="password-title-container">
          <h2 class="password-title">간편 비밀번호 설정</h2>
          <p class="password-desc">
            생년월일, 휴대폰 번호 또는<br />
            동일하거나 연속된 숫자는 등록이 제한됩니다.
          </p>
        </section>

        <!-- 6자리 비밀번호 입력 도트 인디케이터 -->
        <section class="password-dots-container">
          <div class="password-dots-wrapper" aria-label="비밀번호 6자리 입력">
            <!-- 입력 완료 시 .is-filled 클래스 추가 -->
            <span class="dot-item"></span>
            <span class="dot-item"></span>
            <span class="dot-item"></span>
            <span class="dot-item"></span>
            <span class="dot-item"></span>
            <span class="dot-item"></span>
          </div>
        </section>

        <!-- 보안 키패드 작동 뱃지 -->
        <div class="security-badge-wrapper">
          <div class="security-badge">
            <i class="icon-security-shield" aria-hidden="true"></i>
            <span class="security-text">보안 키패드 작동 중</span>
          </div>
        </div>
      </main>

      <!-- 하단 보안 키패드 영역 -->
      <section class="security-keypad-container">
        <!-- 상단 보조 링크 -->
        <div class="keypad-util-wrapper">
          <button type="button" class="btn-keypad-reset">간편 비밀번호 재설정</button>
        </div>

        <!-- 3x4 키패드 그리드 -->
        <div class="keypad-grid">
          <button type="button" class="btn-keypad-num">9</button>
          <button type="button" class="btn-keypad-num">6</button>
          <button type="button" class="btn-keypad-num">7</button>

          <button type="button" class="btn-keypad-num">2</button>
          <button type="button" class="btn-keypad-num">4</button>
          <button type="button" class="btn-keypad-num">3</button>

          <button type="button" class="btn-keypad-num">1</button>
          <button type="button" class="btn-keypad-num">8</button>
          <button type="button" class="btn-keypad-num">0</button>

          <!-- 하단 기능키 (백스페이스 / 5 / 재배열) -->
          <button type="button" class="btn-keypad-action btn-backspace" aria-label="한 글자 지우기">
            <i class="icon-keypad-backspace" aria-hidden="true"></i>
          </button>
          <button type="button" class="btn-keypad-num">5</button>
          <button type="button" class="btn-keypad-action btn-reorder">재배열</button>
        </div>
      </section>
    </div>
  </body>
</html>
