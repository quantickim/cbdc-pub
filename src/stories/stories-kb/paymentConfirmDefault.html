<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/common.css" />
    <link rel="stylesheet" href="../../shared/assets/styles/style.css" />
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
    <script type="text/javascript" src="../../shared/assets/js/js-kb/app.js"></script>
  </head>
  <body class="KBB">
    <div class="page-pay-confirm-KBB">
      <!-- 상단 공통 헤더 -->
      <header class="common-header">
        <button type="button" class="btn-go-main">메인으로</button>
      </header>

      <main class="pay-confirm-main">
        <!-- 타이틀 -->
        <section class="pay-confirm-title-container">
          <h2 class="pay-title">
            스피카 나폴리 합정에서<br />
            결제 하시겠습니까?
          </h2>
        </section>

        <!-- 바우처 혜택 적용 선택 카드 -->
        <section class="pay-confirm-card voucher-card">
          <h3 class="card-title">바우처 혜택 적용 선택</h3>

          <div class="voucher-radio-list">
            <!-- 적용 안함 -->
            <label class="voucher-radio-item" for="voucherOpt0">
              <input type="radio" name="voucherOption" id="voucherOpt0" class="radio-input" checked />
              <span class="custom-radio"></span>
              <div class="voucher-info">
                <span class="voucher-name">적용 안함</span>
              </div>
            </label>

            <!-- 11% 캐시백 상품권 (선택됨) -->
            <label class="voucher-radio-item" for="voucherOpt1">
              <input type="radio" name="voucherOption" id="voucherOpt1" class="radio-input" />
              <span class="custom-radio"></span>
              <div class="voucher-info">
                <span class="voucher-name">11% 캐시백 상품권</span>
                <span class="voucher-desc">최소 1만원 이상 결제 시 사용 가능</span>
              </div>
            </label>

            <!-- [사용불가] 캐시백 상품권 (비활성화) -->
            <label class="voucher-radio-item is-disabled" for="voucherOpt2">
              <input type="radio" name="voucherOption" id="voucherOpt2" class="radio-input" disabled />
              <span class="custom-radio"></span>
              <div class="voucher-info">
                <span class="voucher-name">[사용불가] 캐시백 상품권</span>
              </div>
            </label>

            <!-- 보조금 상품권 20,000원 -->
            <label class="voucher-radio-item" for="voucherOpt3">
              <input type="radio" name="voucherOption" id="voucherOpt3" class="radio-input" />
              <span class="custom-radio"></span>
              <div class="voucher-info">
                <span class="voucher-name">보조금 상품권 20,000원</span>
              </div>
            </label>
          </div>

          <!-- 하단 안내 문구 -->
          <div class="voucher-card-caption">
            <i class="icon-caption-info" aria-hidden="true"></i>
            <p class="caption-text">
              캐시백 상품권 사용 시, 결제 후 상품권 금액만큼 예금 토큰으로 추후 환급해 드립니다.
            </p>
          </div>
        </section>

        <!-- 금액 정보 카드 그룹 -->
        <section class="pay-price-summary-container">
          <!-- 결제 예금 토큰 -->
          <div class="price-summary-card">
            <span class="price-label">결제 예금 토큰</span>
            <div class="price-val-wrapper">
              <span class="price-value">50,000</span>
              <span class="price-unit">원</span>
            </div>
          </div>

          <!-- 최종 혜택가 (강조 카드) -->
          <div class="price-summary-card highlight-card">
            <span class="price-label">최종 혜택가</span>
            <div class="price-val-wrapper">
              <span class="price-value">50,000</span>
              <span class="price-unit">원</span>
            </div>
          </div>
        </section>

        <!-- 유의사항 아코디언 공통 컴포넌트 -->
        <section class="common-notice-accordion">
          <button type="button" class="btn-notice-toggle is-open" aria-expanded="true">
            <div class="title-wrapper">
              <i class="icon-notice-info" aria-hidden="true"></i>
              <span class="notice-title">유의사항 안내</span>
            </div>
            <i class="icon-arrow-toggle" aria-hidden="true"></i>
          </button>

          <div class="notice-content-body">
            <ul class="notice-bullet-list">
              <li class="bullet-main-item">
                아래 취소 및 환불 규정을 확인해주세요.
                <ul class="bullet-sub-list">
                  <li class="bullet-sub-item">온라인 결제의 경우에는 결제하신 사용처에서 환불요청하시기 바랍니다.</li>
                  <li class="bullet-sub-item">기타 취소 및 환불 관련 사항은 1:1 문의 또는 고객센터에 문의해 주세요.</li>
                </ul>
              </li>
            </ul>
          </div>
        </section>
      </main>

      <!-- 공통 하단 고정 버튼 -->
      <div class="fixed-bottom-btn-wrapper">
        <button type="button" class="btn-confirm-bottom">결제하기</button>
      </div>
    </div>
  </body>
</html>
