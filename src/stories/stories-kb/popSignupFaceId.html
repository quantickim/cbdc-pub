<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <title>CBDC - 예금 토큰 전자지갑</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
    <script type="text/javascript" src="../../shared/assets/js/js-kb/app.js"></script>
  </head>
  <body class="KBB">
    <div class="page-complete-result-KBB">
      <!-- 1. 상단 헤더 -->
      <header class="common-header">
        <button type="button" class="btn-go-main">국민지갑 메인</button>
      </header>

      <!-- 3. 중앙 완료 메시지 본문 -->
      <main class="complete-main-content">
        <!-- 완료 체크 그래픽 (웜그레이 원형 + 옐로우 체크) -->
        <div class="complete-status-icon">
          <i class="icon-check-yellow" aria-hidden="true"></i>
        </div>

        <!-- 결과 메시지 타이틀 -->
        <h2 class="complete-result-title">
          예금 토큰 전자지갑이<br />
          만들어졌어요
        </h2>
      </main>

      <!-- 4. 하단 고정 버튼 영역 -->
      <div class="fixed-bottom-btn-wrapper">
        <button type="button" class="btn-confirm-bottom" id="btnLinkAccountNext">확인</button>
      </div>

      <!-- 5. 공용 중앙 알럿 팝업 (Face ID 등록 완료) -->
      <div class="modal-dialog-overlay active" id="faceIdAlertModal" role="dialog" aria-modal="true">
        <div class="modal-dialog-container">
          <!-- 팝업 본문 -->
          <div class="modal-dialog-content">
            <p class="modal-dialog-description text-center">Face ID 등록이 완료되었습니다.</p>
          </div>

          <!-- 푸터 (단일 확인 버튼 -> flex: 1로 전체 너비) -->
          <div class="modal-dialog-footer">
            <button type="button" class="btn-modal-confirm" id="btnModalConfirm">확인</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
