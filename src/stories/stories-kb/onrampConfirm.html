<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/common.css" />
    <link rel="stylesheet" href="../../shared/assets/styles/style.css" />
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
    <script type="text/javascript" src="../../shared/assets/js/js-kb/app.js"></script>
  </head>
  <body class="KBB">
    <div class="page-convert-confirm-KBB">
      <!-- 상단 공통 헤더 -->
      <header class="common-header">
        <button type="button" class="btn-go-main">메인으로</button>
      </header>

      <main class="convert-confirm-main">
        <!-- 상단 전환 아이콘 비주얼 -->
        <section class="convert-visual-section">
          <div class="convert-icon-flow">
            <span class="icon-circle icon-kb"></span>
            <i class="icon-arrows" aria-hidden="true"></i>
            <span class="icon-circle icon-token"></span>
          </div>

          <!-- 메인 안내 문구 (태그 간 공백 제거) -->
          <h2 class="convert-confirm-title">
            <span class="unit">예금 토큰으로</span><br /><span class="amount">500,000</span><span class="unit">원</span
            ><span class="label">을 전환합니다</span>
          </h2>
        </section>

        <!-- 전환 상세 정보 리스트 -->
        <section class="convert-info-section">
          <ul class="convert-info-list">
            <li class="convert-info-item">
              <span class="label">전환토큰</span>
              <span class="value">예금 토큰</span>
            </li>
            <li class="convert-info-item">
              <span class="label">연계계좌</span>
              <span class="value account-text">
                국민은행<br />
                <span class="account-num">(14019552327425)</span>
              </span>
            </li>
          </ul>
        </section>
      </main>

      <!-- 공통 하단 고정 버튼 (단일 버튼) -->
      <div class="fixed-bottom-btn-wrapper">
        <button type="button" class="btn-confirm-bottom">전환하기</button>
      </div>
    </div>
  </body>
</html>
