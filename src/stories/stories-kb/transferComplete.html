<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
    <script type="text/javascript" src="../../shared/assets/js/js-kb/app.js"></script>
  </head>
  <body class="KBB">
    <div class="page-convert-complete-KBB">
      <!-- 상단 공통 헤더 -->
      <header class="common-header">
        <button type="button" class="btn-go-main">전자지갑 메인</button>
      </header>

      <main class="convert-complete-main">
        <!-- 상단 완료 체크 비주얼 및 타이틀 -->
        <section class="convert-visual-section">
          <div class="complete-status-icon">
            <i class="icon-check-yellow" aria-hidden="true"></i>
          </div>
          <h2 class="convert-complete-title">24,000원을 송금했어요</h2>
        </section>

        <!-- 전환 상세 내역 리스트 -->
        <section class="convert-info-section">
          <ul class="convert-info-list">
            <li class="convert-info-item">
              <span class="convert-info-label">거래 종류</span>
              <span class="value">송금</span>
            </li>
            <li class="convert-info-item">
              <span class="convert-info-label">받는 분</span>
              <span class="value">김한국</span>
            </li>
            <li class="convert-info-item">
              <span class="convert-info-label">전자지갑 주소</span>
              <span class="value">KB국민 012345-67-890125</span>
            </li>
          </ul>

          <!-- 하단 안내 문구 -->
          <div class="common-caption-message">
            <i class="icon-caption-info" aria-hidden="true"></i>
            <span class="caption-text">거래 내용은 최대 5분 내에 이용 내역에서 확인할 수 있어요.</span>
          </div>
        </section>
      </main>

      <!-- 공통 하단 고정 버튼 (2버튼) -->
      <div class="fixed-bottom-dual-btn-wrapper">
        <button type="button" class="btn-dual-cancel">이용내역 조회</button>
        <button type="button" class="btn-dual-confirm">확인</button>
      </div>
    </div>
    <script src="../../shared/assets/js/js-kb/pub-change-notes.js"></script>
  </body>
</html>
