<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>예금토큰 전자지갑 만들기 - KB국민은행</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
    <script type="text/javascript" src="../../shared/assets/js/js-kb/app.js"></script>
  </head>
  <body class="KBB">
    <div class="page-create-wallet-KBB">
      <!-- 상단 공통 헤더 (유지) -->
      <header>
        <div class="common-header">
          <button type="button" class="btn-go-main">국민지갑 메인</button>
        </div>
      </header>

      <!-- 메인 콘텐츠 영역 -->
      <main>
        <!-- 본문 인트로 섹션 -->
        <section class="create-wallet-intro-section">
          <h2 class="create-wallet-intro-title">
            서비스 이용을 위해<br />
            예금토큰 전자지갑을 만들게요
          </h2>
          <p class="create-wallet-intro-desc">
            예금토큰은 디지털로 발행된 새로운 형태의<br />
            화폐로 현금과 동일한 가치를 가져요
          </p>
        </section>

        <!-- 중앙 일러스트 그래픽 (i 태그 기반 아이콘/이미지 컨벤션) -->
        <section class="create-wallet-visual-section">
          <div class="wallet-visual-wrapper">
            <i class="img-create-wallet-visual" aria-hidden="true"></i>
          </div>
        </section>

        <!-- 가입 준비사항 안내 카드 섹션 -->
        <section class="create-wallet-prep-section">
          <div class="wallet-prep-card">
            <h3 class="card-title">빠른 가입을 위해 미리 준비해주세요</h3>
            <ul class="prep-checklist">
              <li class="prep-item">
                <i class="icon-check-orange" aria-hidden="true"></i>
                <span class="prep-text">본인 명의 휴대폰</span>
              </li>
              <li class="prep-item">
                <i class="icon-check-orange" aria-hidden="true"></i>
                <span class="prep-text">KB 국민은행 입출금 계좌</span>
              </li>
              <li class="prep-item">
                <i class="icon-check-orange" aria-hidden="true"></i>
                <span class="prep-text">신분증(주민등록증 또는 운전면허증)</span>
              </li>
              <li class="prep-item">
                <i class="icon-check-orange" aria-hidden="true"></i>
                <span class="prep-text">KB국민인증서</span>
              </li>
            </ul>
          </div>
        </section>
      </main>

      <!-- 하단 고정 단일 액션 버튼 (유지) -->
      <div class="fixed-bottom-btn-wrapper">
        <button type="button" class="btn-confirm-bottom" id="btnCreateWallet">지갑 만들기</button>
      </div>
    </div>
  </body>
</html>
