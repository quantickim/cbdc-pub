<!doctype html>
<html lang="ko">
 <head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
 <title>CBDC - APP</title>
 <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
 <script type="text/javascript" src="../../shared/assets/js/js-kb/app.js"></script>
 </head>
 <body class="KBB">
 <!-- 거래제한 중앙 얼럿 모달 (공통 modal-dialog 규격) -->
 <div class="modal-dialog-overlay active" id="modalTradeRestriction" role="dialog" aria-modal="true">
 <div class="modal-dialog-container main-modal">
 <!-- 모달 본문 -->
 <div class="modal-dialog-content">
 <h3 class="modal-dialog-title">거래제한</h3>

 <!-- 제한 사유 강조 -->
 <p class="modal-dialog-reason">사유(이상거래 감지)</p>

 <!-- 설명 문구 -->
 <p class="modal-dialog-description">
 현재 일부 거래가 제한된 상태입니다.<br />
 관련 문의 사항은 1:1 문의 또는 고객센터를 이용해주세요.
 </p>

 <!-- 오늘은 다시 보지 않기 체크박스 -->
 <div class="modal-checkbox-wrapper">
 <label class="custom-checkbox-label" for="chkDoNotShowToday">
 <input type="checkbox" id="chkDoNotShowToday" class="custom-checkbox-input" checked />
 <span class="custom-checkbox-icon" aria-hidden="true">
 <i class="icon-chk" aria-hidden="true"></i>
 </span>
 <span class="checkbox-text">오늘은 다시 보지 않기</span>
 </label>
 </div>
 </div>

 <!-- 공통 4:6 하단 버튼 푸터 (취소 4 : 확인 6) -->
 <div class="modal-dialog-footer">
 <button type="button" class="btn-modal-cancel" id="btnRestrictionCancel">취소</button>
 <button type="button" class="btn-modal-confirm" id="btnRestrictionConfirm">확인</button>
 </div>
 </div>
 </div>

 <!-- 팝업 동작 스크립트 -->
</body>
</html>
