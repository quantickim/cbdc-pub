<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>CBDC - 1:1 문의 수정하기</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
    <script type="text/javascript" src="../../shared/assets/js/js-kb/app.js"></script>
  </head>
  <body class="page-inquiry-write-KBB KBB">
    <!-- 공통 상단 헤더 -->
    <header>
      <div class="common-header">
        <button type="button" class="btn-go-main">메인으로</button>
      </div>
    </header>

    <main>
      <!-- 상단 타이틀 -->
      <section class="inquiry-write-title-area">
        <h1 class="page-title">무엇을 도와드릴까요?</h1>
      </section>

      <!-- 입력 폼 영역 (수정 모드 데이터 바인딩) -->
      <section class="inquiry-form-section">
        <!-- 1. 문의 목록 (서비스 이용 선택됨) -->
        <div class="form-group">
          <label class="form-label" for="categorySelect">문의 목록</label>
          <div class="select-field-wrap">
            <select id="categorySelect" class="common-form-select bank-select">
              <option value="" disabled>카테고리 선택</option>
              <option value="service" selected>서비스 이용</option>
              <option value="join">가입 · 변경 · 탈퇴</option>
              <option value="token">지갑 · 토큰</option>
            </select>
            <i class="icon-select-arrow" aria-hidden="true"></i>
          </div>
        </div>

        <!-- 2. 문의 제목 -->
        <div class="form-group">
          <label class="form-label" for="inquiryTitle">문의 제목</label>
          <div class="common-input-field">
            <input
              type="text"
              id="inquiryTitle"
              class="common-form-input"
              value="지갑은 왜 만들어야해요?"
              placeholder="제목을 입력해주세요"
            />
          </div>
        </div>

        <!-- 3. 문의 내용 (수정 기존 텍스트 + 카운터 초기값 10) -->
        <div class="form-group">
          <label class="form-label" for="inquiryContent">문의 내용</label>
          <div class="textarea-box-wrap">
            <textarea
              id="inquiryContent"
              class="form-textarea"
              maxlength="500"
              placeholder="내용을 입력해주세요"
              oninput="document.getElementById('charCount').textContent = this.value.length;"
            >
서비스 이용 시 지갑은 왜 만들어야해요? 계좌로는 사용을 못하나요?</textarea
            >
            <div class="textarea-counter">
              <span id="charCount" class="current common-font-roboto">10</span>
              <span class="divider">/</span>
              <span class="max common-font-roboto">500</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 공통 아코디언 컴포넌트 (.common-notice-accordion) -->
      <section class="common-notice-accordion">
        <button type="button" class="btn-notice-toggle is-open" aria-expanded="true">
          <div class="title-wrapper">
            <i class="icon-notice-info" aria-hidden="true"></i>
            <span class="notice-title">알려드립니다</span>
          </div>
          <i class="icon-arrow-toggle" aria-hidden="true"></i>
        </button>

        <div class="notice-content-body">
          <ul class="notice-bullet-list">
            <li class="bullet-main-item">담당자 확인 즉시 답변해 드립니다.</li>
            <li class="bullet-main-item">
              등록하신 문의의 답변이 완료된 경우 새로운 문의 작성하기로 추가 문의 부탁드립니다.
            </li>
          </ul>
        </div>
      </section>
    </main>

    <!-- 공통 하단 고정 2버튼 푸터 규격 -->
    <div class="fixed-bottom-dual-btn-wrapper">
      <button type="button" class="btn-dual-cancel" data-action="back">취소</button>
      <button type="button" class="btn-dual-confirm">등록하기</button>
    </div>
  </body>
</html>
