<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
  </head>
  <body class="KBB">
    <div class="page-pay-complete-KBB">
      <!-- 상단 공통 헤더 -->
      <header class="common-header">
        <button type="button" class="btn-go-main">전자지갑 메인</button>
      </header>

      <main class="pay-complete-main">
        <!-- 완료 메시지 & 금액 섹션 -->
        <section class="pay-complete-result-section">
          <div class="complete-status-icon">
            <i class="icon-check-yellow" aria-hidden="true"></i>
          </div>
          <h2 class="complete-title">20,000원을 결제했어요</h2>
        </section>

        <!-- 결제 기본 정보 리스트 -->
        <section class="complete-info-section">
          <div class="info-list-group">
            <div class="info-row">
              <span class="info-label">거래 종류</span>
              <span class="info-value">결제</span>
            </div>
            <div class="info-row align-top">
              <span class="info-label">결제 승인번호</span>
              <span class="info-value word-break">
                KBBCBcfa2c273fd934428949<br />
                070eead34c29e1
              </span>
            </div>
          </div>

          <!-- 혜택 정보 리스트 -->
          <!-- <div class="info-list-group">
 <div class="info-row">
 <span class="info-label">적립 예정 예금 토큰</span>
 <span class="info-value">5,000원</span>
 </div>
 </div> -->

          <!-- 하단 안내 문구 -->
          <div class="common-caption-message">
            <i class="icon-caption-info" aria-hidden="true"></i>
            <span class="caption-text">거래 내용은 최대 5분 내에 이용 내역에서 확인할 수 있어요.</span>
          </div>
        </section>
      </main>

      <!-- 하단 공통 2버튼 고정 푸터 -->
      <div class="fixed-bottom-dual-btn-wrapper">
        <button type="button" class="btn-dual-sub">이용내역 조회</button>
        <button type="button" class="btn-dual-main">확인</button>
      </div>
    </div>
    <script src="../../shared/assets/js/js-kb/pub-change-notes.js"></script>
  </body>
</html>
