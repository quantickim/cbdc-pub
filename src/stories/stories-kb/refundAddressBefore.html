<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/common.css" />
    <link rel="stylesheet" href="../../shared/assets/styles/style.css" />
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
    <script type="text/javascript" src="../../shared/assets/js/js-kb/app.js"></script>
  </head>
  <body class="KBB">
    <div class="page-remit-address-KBB">
      <!-- 상단 공통 헤더 -->
      <header class="common-header">
        <button type="button" class="btn-go-main">메인으로</button>
      </header>

      <main class="remit-address-main">
        <!-- 타이틀 -->
        <h2 class="remit-address-title">누구의 지갑으로 보낼까요?</h2>

        <!-- 공통 인풋 필드 (삭제 버튼 포함) -->
        <div class="common-input-field">
          <input
            type="text"
            class="common-form-input"
            id="remitAddressInput"
            placeholder="예금 토큰 전자지갑 주소를 입력해주세요"
            aria-label="전자지갑 주소 입력"
          />
          <button
            type="button"
            class="btn-input-clear"
            id="btnRemitAddressClear"
            aria-label="입력내용 삭제"
            style="display: none"
          >
            <i class="icon-input-clear" aria-hidden="true"></i>
          </button>
        </div>

        <!-- QR송금 / 연락처송금 퀵 링크 액션 -->
        <div class="remit-quick-actions">
          <button type="button" class="btn-quick-link">
            <i class="icon-quick-qr" aria-hidden="true"></i>
            <span>QR송금</span>
          </button>
          <span class="divider" aria-hidden="true"></span>
          <button type="button" class="btn-quick-link">
            <i class="icon-quick-contact" aria-hidden="true"></i>
            <span>연락처송금</span>
          </button>
        </div>
      </main>

      <!-- 공통 하단 고정 버튼 (비활성화 상태) -->
      <div class="fixed-bottom-btn-wrapper">
        <button type="button" class="btn-confirm-bottom disabled" id="btnRemitNext" disabled>다음</button>
      </div>
    </div>
  </body>
</html>
