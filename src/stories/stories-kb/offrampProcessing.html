<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
    <script type="text/javascript" src="../../shared/assets/js/js-kb/app.js"></script>
  </head>
  <body class="KBB">
    <div class="page-convert-progress-KBB">
      <!-- 상단 공통 헤더 -->
      <header class="common-header">
        <button type="button" class="btn-go-main">메인으로</button>
      </header>

      <main class="convert-progress-main">
        <!-- 상단 타이틀 및 금액 영역 -->
        <section class="convert-progress-title-section">
          <h2 class="convert-progress-title">연계계좌로 전환하고 있어요</h2>
          <div class="convert-progress-amount"><span class="amount">10,000</span><span class="unit">원</span></div>
        </section>

        <!-- 중앙 전환 진행 그래픽 비주얼 영역 -->
        <section class="convert-progress-visual-section">
          <div class="wallet-visual-graphic">
            <i class="img-convert-progress" aria-hidden="true"></i>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
