<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
  </head>
  <body class="KBB">
    <!-- 중앙 얼럿 팝업 딤 오버레이 -->
    <div class="modal-dialog-overlay active">
      <div class="modal-dialog-container">
        <!-- 본문 콘텐츠 -->
        <div class="modal-dialog-content">
          <h3 class="modal-dialog-title">사업자 정보 삭제</h3>
          <div class="modal-dialog-description">
            <p>사업자 정보를 삭제하시겠습니까?</p>
            <br />
            <p>
              사업자 정보를 삭제하시면<br />더 이상 현금영수증 발행이 불가능하며,<br />기존 송금 완료 건에 대해서
              현금영수증<br />발급/취소도 진행할 수 없습니다.
            </p>
          </div>
        </div>

        <!-- 하단 버튼 영역 (취소 / 삭제) -->
        <div class="modal-dialog-footer">
          <button type="button" class="btn-modal-cancel">취소</button>
          <button type="button" class="btn-modal-confirm">삭제</button>
        </div>
      </div>
    </div>
  </body>
</html>
