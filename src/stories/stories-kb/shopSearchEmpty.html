<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/common.css" />
    <link rel="stylesheet" href="../../shared/assets/styles/style.css" />
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
    <script type="text/javascript" src="../../shared/assets/js/js-kb/app.js"></script>
  </head>
  <body class="KBB">
    <div class="page-merchant-KBB">
      <!-- 상단 공통 헤더 -->
      <header class="common-header">
        <button type="button" class="btn-go-main">메인으로</button>
      </header>

      <main class="main-content">
        <!-- 검색 입력 영역 (검색어 입력 상태) -->
        <section class="merchant-search-section">
          <div class="common-input-field merchant-search-field">
            <input
              type="text"
              class="common-form-input"
              value="은행행"
              placeholder="이름, 업종을 검색해보세요"
              aria-label="사용처 이름 또는 업종 검색"
            />
            <button type="button" class="btn-search-action" aria-label="검색">
              <i class="icon-search-black" aria-hidden="true"></i>
            </button>
          </div>
        </section>

        <!-- 현재 위치 & 지도 뷰 버튼 영역 -->
        <section class="merchant-location-section">
          <div class="location-current-wrapper">
            <i class="icon-current-location" aria-hidden="true"></i>
            <span class="location-text">서울 영등포구 여의동</span>
          </div>
          <button type="button" class="btn-map-view" aria-label="지도에서 보기">
            <i class="icon-map-pin" aria-hidden="true"></i>
          </button>
        </section>

        <!-- 필터 & 총 건수 바 (0건일 때 회색 배경 적용 및 토글 없음) -->
        <section class="merchant-filter-bar is-empty">
          <div class="total-count-wrapper">
            <span class="val-unit">총</span>
            <span class="val-number">0</span>
            <span class="val-unit">건</span>
          </div>
        </section>

        <!-- 검색 결과 없음 영역 (Empty State) -->
        <section class="merchant-empty-section">
          <div class="empty-visual-icon">
            <i class="icon-warning-circle-gray" aria-hidden="true"></i>
          </div>
          <p class="empty-primary-text">‘<span class="keyword">은행행</span>’ 검색결과가 없어요</p>
          <p class="empty-sub-text">다른 검색어를 입력해보세요</p>
        </section>
      </main>
    </div>
  </body>
</html>
