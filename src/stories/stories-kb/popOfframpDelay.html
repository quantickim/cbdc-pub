<!doctype html>
<html lang="ko">
  <head>

    <div class="modal-dialog-overlay active">

        <!-- 본문 콘텐츠 -->

          <h3 class="modal-dialog-title">전환이 지연되고 있습니다</h3>

          </p>
        </div>

        <!-- 하단 단일 확인 버튼 -->
        <div class="modal-dialog-footer">
          <button type="button" class="btn-modal-confirm">확인</button>
        </div>
      </div>
    </div>
