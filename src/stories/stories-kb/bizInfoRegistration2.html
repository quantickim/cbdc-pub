<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
  </head>
  <body class="KBB">
    <div class="page-business-register-KBB has-fixed-bottom">
      <!-- 상단 공통 헤더 -->
      <header class="common-header">
        <button type="button" class="btn-go-main">메인으로</button>
      </header>

      <main class="business-register-main">
        <!-- 타이틀 -->
        <section class="business-register-title-container">
          <h2 class="page-title">사업자 정보 등록</h2>
        </section>

        <!-- 안내 문구 박스 -->
        <section class="business-register-guide-box">
          <ul class="guide-list">
            <li class="guide-item">현금영수증을 발급하려면 반드시 현금영수증 가맹점 가입이 필요합니다.</li>
            <li class="guide-item">가맹점 가입은 금융결제원 e서비스(kftcvan.or.kr) 에서 가능합니다.</li>
            <li class="guide-item">
              현금영수증 의무발행은 의무발행업종 사업자가 건당 10만원 이상 현금거래 시 소비자가 요구하지 않아도
              자진발급(010-000-1234) 해야 하며, 미발급 시 20% 가산세가 부과됩니다.
            </li>
          </ul>
        </section>

        <!-- 사업자 정보 입력 폼 -->
        <section class="business-register-form-container">
          <!-- 사업자등록번호 -->
          <div class="form-item">
            <label class="form-label" for="bizNum1">사업자등록번호</label>
            <div class="business-number-inputs">
              <div class="input-item common-input-field flex-1">
                <input
                  type="text"
                  inputmode="numeric"
                  id="bizNum1"
                  class="common-form-input"
                  placeholder="3자리"
                  maxlength="3"
                  value="111"
                />
              </div>
              <div class="input-item common-input-field flex-2">
                <input
                  type="text"
                  inputmode="numeric"
                  id="bizNum2"
                  class="common-form-input"
                  placeholder="2자리"
                  maxlength="2"
                  value="222"
                />
              </div>
              <div class="input-item common-input-field flex-3">
                <input
                  type="text"
                  inputmode="numeric"
                  id="bizNum3"
                  class="common-form-input"
                  placeholder="5자리"
                  maxlength="5"
                  value="34567"
                />
              </div>
            </div>
          </div>

          <!-- 상호 -->
          <div class="form-item">
            <label class="form-label" for="bizName">상호</label>
            <div class="common-input-field">
              <input type="text" id="bizName" class="common-form-input kbfg-text" placeholder="상호명을 입력하세요" />
            </div>
          </div>

          <!-- 성명 -->
          <div class="form-item">
            <label class="form-label" for="ownerName">성명</label>
            <div class="common-input-field">
              <input type="text" id="ownerName" class="common-form-input kbfg-text" placeholder="이름을 입력하세요" />
            </div>
          </div>

          <!-- 개업연월일 -->
          <div class="form-item">
            <label class="form-label" for="openDate">개업연월일</label>
            <div class="common-input-field">
              <input
                type="text"
                inputmode="numeric"
                id="openDate"
                class="common-form-input"
                placeholder="6자리"
                maxlength="6"
              />
            </div>
          </div>
        </section>
      </main>

      <!-- 하단 고정 버튼 -->
      <div class="fixed-bottom-btn-wrapper">
        <button type="button" class="btn-confirm-bottom disabled">등록</button>
      </div>
    </div>
  </body>
</html>
