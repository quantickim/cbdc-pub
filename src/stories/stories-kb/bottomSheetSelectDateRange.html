<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/common.css" />
    <link rel="stylesheet" href="../../shared/assets/styles/style.css" />
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
  </head>
  <body class="KBB">
    <!-- 바텀시트 딤 오버레이 -->
    <div class="bottom-sheet-overlay active">
      <div class="bottom-sheet-container">
        <!-- 상단 헤더 -->
        <div class="bottom-sheet-header">
          <h3 class="bottom-sheet-title">조회 기간 선택</h3>
          <button type="button" class="btn-sheet-close" aria-label="닫기"></button>
        </div>

        <!-- 본문 콘텐츠 -->
        <div class="bottom-sheet-content">
          <!-- 안내 캡션 -->
          <div class="caption-info-message">
            <i class="icon-caption-info" aria-hidden="true"></i>
            <span>최근 1년 간의 거래 기록만 조회 할 수 있습니다.</span>
          </div>

          <!-- 연월 선택 리스트 -->
          <ul class="period-select-list">
            <li class="period-select-item">
              <button type="button" class="btn-period-option" aria-selected="true">
                <span class="period-text">2025년 3월</span>
                <i class="icon-check-arrow" aria-hidden="true"></i>
              </button>
            </li>
            <li class="period-select-item">
              <button type="button" class="btn-period-option" aria-selected="false">
                <span class="period-text">2025년 2월</span>
              </button>
            </li>
            <li class="period-select-item">
              <button type="button" class="btn-period-option" aria-selected="false">
                <span class="period-text">2025년 1월</span>
              </button>
            </li>
            <li class="period-select-item">
              <button type="button" class="btn-period-option" aria-selected="false">
                <span class="period-text">2024년 12월</span>
              </button>
            </li>
            <li class="period-select-item">
              <button type="button" class="btn-period-option" aria-selected="false">
                <span class="period-text">2024년 11월</span>
              </button>
            </li>
            <li class="period-select-item">
              <button type="button" class="btn-period-option" aria-selected="false">
                <span class="period-text">2024년 10월</span>
              </button>
            </li>
          </ul>
        </div>

        <!-- 하단 단일 확인 버튼 -->
        <div class="bottom-sheet-footer">
          <button type="button" class="btn-sheet-confirm">확인</button>
        </div>
      </div>
    </div>
  </body>
</html>
