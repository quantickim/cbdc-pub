<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
  </head>
  <body class="KBB">
    <!-- 바텀시트 딤 오버레이 -->
    <div class="bottom-sheet-overlay active">
      <div class="bottom-sheet-container">
        <!-- 상단 헤더 -->
        <div class="bottom-sheet-header">
          <h3 class="bottom-sheet-title">조회 기간 선택</h3>
          <button type="button" class="btn-sheet-close" aria-label="닫기"></button>
        </div>

        <!-- 본문 콘텐츠 -->
        <div class="bottom-sheet-content">
          <!-- 안내 캡션 -->
          <div class="caption-info-message">
            <i class="icon-caption-info" aria-hidden="true"></i>
            <span>최근 1년 동안의 거래 기록을 확인할 수 있어요.</span>
          </div>

          <!-- 연월 선택 리스트 -->
          <!-- 한 화면에 6개, 넘치면 스크롤 (is-month-list) -->
          <ul class="period-select-list is-month-list">
            <li class="period-select-item is-selected">
              <button type="button" class="btn-period-option" aria-selected="true">
                <span class="period-text">2026년 5월</span>
                <i class="icon-check-arrow" aria-hidden="true"></i>
              </button>
            </li>
            <li class="period-select-item">
              <button type="button" class="btn-period-option" aria-selected="false">
                <span class="period-text">2026년 4월</span>
              </button>
            </li>
            <li class="period-select-item">
              <button type="button" class="btn-period-option" aria-selected="false">
                <span class="period-text">2026년 3월</span>
              </button>
            </li>
            <li class="period-select-item">
              <button type="button" class="btn-period-option" aria-selected="false">
                <span class="period-text">2026년 2월</span>
              </button>
            </li>
            <li class="period-select-item">
              <button type="button" class="btn-period-option" aria-selected="false">
                <span class="period-text">2026년 1월</span>
              </button>
            </li>
            <li class="period-select-item">
              <button type="button" class="btn-period-option" aria-selected="false">
                <span class="period-text">2025년 12월</span>
              </button>
            </li>
            <li class="period-select-item">
              <button type="button" class="btn-period-option" aria-selected="false">
                <span class="period-text">2025년 11월</span>
              </button>
            </li>
            <li class="period-select-item">
              <button type="button" class="btn-period-option" aria-selected="false">
                <span class="period-text">2025년 10월</span>
              </button>
            </li>
            <li class="period-select-item">
              <button type="button" class="btn-period-option" aria-selected="false">
                <span class="period-text">2025년 9월</span>
              </button>
            </li>
            <li class="period-select-item">
              <button type="button" class="btn-period-option" aria-selected="false">
                <span class="period-text">2025년 8월</span>
              </button>
            </li>
            <li class="period-select-item">
              <button type="button" class="btn-period-option" aria-selected="false">
                <span class="period-text">2025년 7월</span>
              </button>
            </li>
            <li class="period-select-item">
              <button type="button" class="btn-period-option" aria-selected="false">
                <span class="period-text">2025년 6월</span>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </body>
</html>
