<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
    <script type="text/javascript" src="../../shared/assets/js/js-kb/app.js"></script>
  </head>
  <body class="KBB">
    <div class="page-history-detail-KBB has-fixed-bottom">
      <header class="common-header">
        <button type="button" class="btn-go-main">메인으로</button>
      </header>
      <main class="history-detail-main">
        <!-- 메인 결제 상세 정보 -->
        <section class="history-detail-container">
          <div class="history-detail-title-wrapper">
            <h3 class="history-detail-title">스피카 나폴리 합정</h3>
            <span class="common-badge badge-payment">결제</span>
          </div>

          <div class="history-detail-info-list">
            <div class="history-detail-info-item">
              <span class="history-detail-info-label">결제 금액</span>
              <div class="common-transactions-value-wrapper">
                <span class="common-transactions-sign sign-minus">-</span>
                <span class="common-transactions-value sign-minus">20,000</span>
                <span class="common-transactions-won">원</span>
              </div>
            </div>
            <div class="history-detail-info-item">
              <span class="history-detail-info-label">일시</span>
              <span class="history-detail-info-value">24.07.29 20:49:51</span>
            </div>
            <div class="history-detail-info-item align-top">
              <span class="history-detail-info-label">결제 승인번호</span>
              <span class="history-detail-info-value word-break"> AAACBe28491842dkhsoholiw<br />e54wegshjs </span>
            </div>
          </div>
        </section>

        <!-- 혜택 상세 정보 섹션 -->
        <section class="history-detail-section benefit-section">
          <h4 class="section-sub-title">혜택</h4>
          <div class="history-detail-info-list">
            <div class="history-detail-info-item">
              <span class="history-detail-info-label">바우처 명</span>
              <span class="history-detail-info-value">캐시백 상품권</span>
            </div>
            <div class="history-detail-info-item">
              <span class="history-detail-info-label">적용 내용</span>
              <span class="history-detail-info-value">5,000 원 캐시백</span>
            </div>
            <div class="history-detail-info-item">
              <span class="history-detail-info-label">예금 토큰 적립 예정</span>
              <span class="history-detail-info-value font-bold">5,000 원</span>
            </div>
          </div>
        </section>

        <!-- 유의사항/알려드립니다 공통 아코디언 -->
        <section class="common-notice-accordion">
          <button type="button" class="btn-notice-toggle is-open" aria-expanded="true">
            <div class="title-wrapper">
              <i class="icon-notice-info" aria-hidden="true"></i>
              <span class="notice-title">알려드립니다</span>
            </div>
            <i class="icon-arrow-toggle" aria-hidden="true"></i>
          </button>

          <div class="notice-content-body">
            <ul class="notice-bullet-list">
              <li class="bullet-main-item">온라인 결제의 경우에는 결제하신 사용처에서 환불요청하시기 바랍니다.</li>
            </ul>
          </div>
        </section>
      </main>
      <!-- 하단 고정 버튼 (비활성화 상태) -->
      <div class="fixed-bottom-btn-wrapper">
        <button type="button" class="btn-confirm-bottom disabled">환불하기</button>
      </div>
    </div>
  </body>
</html>
