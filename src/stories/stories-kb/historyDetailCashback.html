<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />

    <script type="text/javascript" src="../../shared/assets/js/js-kb/app.js"></script>
  </head>
  <body class="KBB">
    <div class="page-history-detail-KBB">
      <!-- 상단 공통 헤더 -->
      <header class="common-header">
        <button type="button" class="btn-go-main">메인으로</button>
      </header>

      <main class="history-detail-main">
        <!-- 메인 결제 상세 정보 -->
        <section class="history-detail-container no-border-bottom">
          <div class="history-detail-title-wrapper">
            <h3 class="history-detail-title">
              $바우처명 캐시백<br />
              두줄 이상 전체 표시
            </h3>
            <span class="common-badge badge-cashback">캐시백</span>
          </div>

          <div class="history-detail-info-list">
            <div class="history-detail-info-item">
              <span class="history-detail-info-label">캐시백 금액</span>
              <div class="common-transactions-value-wrapper">
                <span class="common-transactions-sign sign-plus">+</span>
                <span class="common-transactions-value sign-plus">5,000</span>
                <span class="common-transactions-won">원</span>
              </div>
            </div>
            <div class="history-detail-info-item">
              <span class="history-detail-info-label">일시</span>
              <span class="history-detail-info-value">24.07.29 20:49:51</span>
            </div>
            <div class="history-detail-info-item">
              <span class="history-detail-info-label">바우처정보</span>
              <span class="history-detail-info-value">한국사랑바우처</span>
            </div>
          </div>
          <div class="benefit-btn-wrapper">
            <button type="button" class="btn-outline-detail">바우처 상세 보기</button>
          </div>
        </section>

        <!-- 혜택 상세 섹션 -->
        <section class="history-detail-section benefit-section">
          <h4 class="section-sub-title">관련결제정보</h4>
          <div class="history-detail-info-list">
            <div class="history-detail-info-item">
              <span class="history-detail-info-label">가맹점 정보</span>
              <span class="history-detail-info-value">스피카 나폴리 합정</span>
            </div>
            <div class="history-detail-info-item">
              <span class="history-detail-info-label">결제 금액</span>
              <div class="common-transactions-value-wrapper">
                <span class="common-transactions-value main-color">34,000</span>
                <span class="common-transactions-won">원</span>
              </div>
            </div>
            <div class="history-detail-info-item">
              <span class="history-detail-info-label">결제 일시</span>
              <span class="history-detail-info-value">24.07.29 20:49:51</span>
            </div>
          </div>
          <div class="benefit-btn-wrapper">
            <button type="button" class="btn-outline-detail">상세 보기</button>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
