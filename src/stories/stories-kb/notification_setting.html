<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <title>CBDC - 알림 설정</title>
    <link rel="stylesheet" href="../../shared/assets/styles/common.css" />
    <link rel="stylesheet" href="../../shared/assets/styles/style.css" />
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
    <script type="text/javascript" src="../../shared/assets/js/js-kb/app.js"></script>
  </head>
  <body class="page-auto-setting-KBB KBB">
    <!-- 공통 상단 헤더 -->
    <header>
      <div class="common-header">
        <button type="button" class="btn-go-main">메인으로</button>
      </div>
    </header>

    <main>
      <!-- 설정 항목 리스트 영역 -->
      <section class="auto-setting-list">
        <!-- 0. 마스터 토글: 모든 알람 -->
        <div class="setting-item master-setting-item">
          <div class="item-text-wrapper">
            <p class="item-title">모든 알람</p>
          </div>
          <label class="common-switch" for="switchAllAlarms">
            <input type="checkbox" id="switchAllAlarms" class="switch-input" checked />
            <span class="switch-track">
              <span class="switch-thumb"></span>
            </span>
          </label>
        </div>

        <!-- 1. 토큰・결제 -->
        <div class="setting-item">
          <div class="item-text-wrapper">
            <p class="item-title">토큰・결제</p>
            <p class="item-desc">결제, 송금 등 토큰 이용 시 앱 푸시 알림을 받아요.</p>
          </div>
          <label class="common-switch" for="switchPaymentAlarm">
            <input type="checkbox" id="switchPaymentAlarm" class="switch-input sub-switch" checked />
            <span class="switch-track">
              <span class="switch-thumb"></span>
            </span>
          </label>
        </div>

        <!-- 2. 보안 -->
        <div class="setting-item">
          <div class="item-text-wrapper">
            <p class="item-title">보안</p>
            <p class="item-desc">보안 관련 앱 푸시 알림을 받아요.</p>
          </div>
          <label class="common-switch" for="switchSecurityAlarm">
            <input type="checkbox" id="switchSecurityAlarm" class="switch-input sub-switch" checked />
            <span class="switch-track">
              <span class="switch-thumb"></span>
            </span>
          </label>
        </div>

        <!-- 3. 활동・소식 -->
        <div class="setting-item">
          <div class="item-text-wrapper">
            <p class="item-title">활동・소식</p>
            <p class="item-desc">공지사항 1:1 문의 답변 등 앱 내 활동/소식 관련 앱 푸시 알림을 받아요 .</p>
          </div>
          <label class="common-switch" for="switchActivityAlarm">
            <input type="checkbox" id="switchActivityAlarm" class="switch-input sub-switch" checked />
            <span class="switch-track">
              <span class="switch-thumb"></span>
            </span>
          </label>
        </div>
      </section>

      <!-- 공통 아코디언 컴포넌트 (.common-notice-accordion) -->
      <section class="common-notice-accordion">
        <button type="button" class="btn-notice-toggle is-open" aria-expanded="true">
          <div class="title-wrapper">
            <i class="icon-notice-info" aria-hidden="true"></i>
            <span class="notice-title">알려드립니다</span>
          </div>
          <i class="icon-arrow-toggle" aria-hidden="true"></i>
        </button>

        <div class="notice-content-body">
          <ul class="notice-bullet-list">
            <li class="bullet-main-item">
              서비스 이용에 필수적인 정보에 대한 알림은 설정과 관계없이 앱 푸시 알림이 발송됩니다.
            </li>
          </ul>
        </div>
      </section>
    </main>

    <!-- 첫 번째 토글로 전체 온/오프 및 하위 변경 시 마스터 상태 동기화 -->
  </body>
</html>
