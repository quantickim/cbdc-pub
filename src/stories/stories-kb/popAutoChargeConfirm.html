<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
  </head>
  <body class="KBB">
    <!-- 중앙 팝업 딤 오버레이 -->
    <div class="modal-dialog-overlay active">
      <div class="modal-dialog-container">
        <!-- 본문 콘텐츠 -->
        <div class="modal-dialog-content">
          <h3 class="modal-dialog-title">잔액 부족</h3>
          <p class="modal-dialog-description">
            예금 토큰 잔액이 부족합니다. <br />
            자동 충전을 사용하시면 연결된 계좌에서 <br />
            예금 토큰을 자동 충전하여 결제 가능합니다. <br />
            <br />
            자동 충전 사용을 설정하시겠습니까?
          </p>
        </div>

        <!-- 하단 버튼 영역 (취소 / 삭제) -->
        <div class="modal-dialog-footer">
          <button type="button" class="btn-modal-cancel">취소</button>
          <button type="button" class="btn-modal-confirm">설정하기</button>
        </div>
      </div>
    </div>
  </body>
</html>
