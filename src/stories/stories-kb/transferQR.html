<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
  </head>
  <body class="KBB">
    <div class="page-qr-scan-KBB">
      <header class="common-header">
        <button type="button" class="btn-go-main">메인으로</button>
      </header>
      <main class="qr-scan-main transfer-qr">
        <!-- 안내 문구 -->
        <p class="qr-scan-guide-text">
          아래 사각형에 맞춰<br />
          받으실 분의 지갑 QR코드를 스캔해 주세요.
        </p>

        <!-- 카메라 스캔 뷰파인더 영역 -->
        <div class="qr-scan-viewfinder-wrapper">
          <div class="qr-scan-viewfinder">
            <span class="corner-bracket top-left"></span>
            <span class="corner-bracket top-right"></span>
            <span class="corner-bracket bottom-left"></span>
            <span class="corner-bracket bottom-right"></span>
            <div class="qr-scan-camera-preview"></div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
