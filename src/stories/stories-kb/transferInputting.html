<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
    <script type="text/javascript" src="../../shared/assets/js/js-kb/app.js"></script>
  </head>
  <body class="KBB">
    <div class="page-remit-amount-KBB">
      <!-- 상단 공통 헤더 -->
      <header class="common-header">
        <button type="button" class="btn-go-main">메인으로</button>
      </header>

      <main class="remit-amount-main">
        <!-- 대상 정보 영역 -->
        <div class="remit-target-info">
          <span class="target-name">김한국님</span>
          <span class="target-bank">국민</span>
          <span class="target-account val-number">14019552327425</span>
          <span class="target-suffix">로</span>
        </div>

        <!-- 송금 금액 질문 & 입력 영역 -->
        <section class="convert-question-section">
          <!-- 인풋 + '원' 단위 래퍼 (값이 있으므로 .has-value 기본 적용) -->
          <div class="question-title-wrapper has-value" id="remitTitleWrapper">
            <input
              type="text"
              id="remitAmountInput"
              class="question-input"
              placeholder="얼마를 송금할까요?"
              inputmode="numeric"
              autocomplete="off"
              value="500,000"
            />
            <span class="unit" aria-hidden="true">원</span>
          </div>

          <!-- 송금 가능 금액 영역 (초기 한도초과 상태이므로 .is-insufficient 기본 적용) -->
          <div class="available-amount-wrapper is-insufficient" id="availableAmountWrapper">
            <i class="icon-warning-fill" aria-hidden="true"></i>
            <span class="insufficient-tag">[잔액부족] </span>
            <span class="label">송금 가능 금액</span>
            <span class="amount" id="maxRemitAmount" data-max="1000000">1,000,000</span>
            <span class="unit">원</span>
          </div>
        </section>

        <!-- 옵션 및 전환 링크 섹션 -->
        <div class="remit-option-section">
          <!-- 좌측 안심송금 체크박스 및 말풍선 툴팁 -->
          <div class="safe-remit-wrapper">
            <label class="custom-checkbox-label" for="chkSafeRemit">
              <input type="checkbox" id="chkSafeRemit" class="custom-checkbox-input" />
              <span class="custom-checkbox-icon" aria-hidden="true">
                <i class="icon-chk" aria-hidden="true"></i>
              </span>
              <span class="checkbox-text">안심송금으로 보내기</span>
            </label>

            <!-- 말풍선 툴팁 -->
            <div class="speech-bubble-tooltip" id="safeRemitTooltip">
              <span class="tooltip-text">거래 조건 이행 시 송금이 진행돼요</span>
            </div>
          </div>

          <!-- 우측 예금 토큰 전환하기 링크 -->
          <div class="token-convert-link-wrapper">
            <a href="javascript:void(0);" class="link-token-convert">예금 토큰 전환하기</a>
          </div>
        </div>
      </main>

      <!-- 공통 하단 고정 버튼 (초기 한도 초과 상태이므로 비활성화) -->
      <div class="fixed-bottom-btn-wrapper">
        <button type="button" class="btn-confirm-bottom disabled" id="btnRemitAmountConfirm" disabled>확인</button>
      </div>
    </div>

    <!-- 스크립트: 한도 초과 에러 모드 제어 -->
  </body>
</html>
