<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/common.css" />
    <link rel="stylesheet" href="../../shared/assets/styles/style.css" />
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
  </head>
  <body class="KBB">
    <!-- 바텀시트 딤 오버레이 -->
    <div class="bottom-sheet-overlay active">
      <div class="bottom-sheet-container">
        <!-- 상단 헤더 (타이틀 + 닫기 버튼) -->
        <div class="bottom-sheet-header">
          <h3 class="bottom-sheet-title">환불 QR 코드</h3>
          <button type="button" class="btn-sheet-close" aria-label="닫기"></button>
        </div>

        <!-- 본문 콘텐츠 -->
        <div class="bottom-sheet-content">
          <!-- 환불총액 영역 -->
          <div class="refund-total-wrapper">
            <span class="refund-total-label">환불총액</span>
            <div class="refund-total-amount">
              <span class="amount-value">20,500</span>
              <span class="amount-unit">원</span>
            </div>
          </div>

          <!-- QR 코드 메인 영역 -->
          <div class="qr-code-wrapper">
            <div class="qr-code-img">
              <!-- 실제 QR 이미지가 들어갈 영역 -->
              <!-- <img src="../../shared/assets/images/img-qr-placeholder.png" alt="환불 QR 코드" /> -->
              <i></i>
            </div>
            <p class="qr-guide-text">
              위 QR코드를<br />
              사용처에 제시해 주세요.
            </p>
          </div>

          <!-- 하단 유틸리티 안내 문구 -->
          <div class="qr-notice-wrapper">
            <i class="icon-notice-bullet" aria-hidden="true"></i>
            <span class="qr-notice-text">사용처에서 QR코드 확인 후 환불 처리가 완료됩니다.</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
