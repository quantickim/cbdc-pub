<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
  </head>
  <body class="KBB">
    <!-- 연결 계좌 변경 안내 모달, 계좌 비밀번호 인증 횟수 초과 (스토리보드 0.7 44p 3) -->
    <div class="modal-dialog-overlay active" role="dialog" aria-modal="true">
      <div class="modal-dialog-container">
        <!-- 모달 본문 (타이틀 없는 본문 단독형) -->
        <div class="modal-dialog-content">
          <p class="modal-dialog-description no-title">
            해당 계좌 비밀번호 인증 가능 횟수가 초과되어, 비밀번호 변경 후 재인증하거나 다른 계좌로 연결해주세요.
          </p>
        </div>

        <!-- 하단 단일 확인 버튼 -->
        <div class="modal-dialog-footer">
          <button type="button" class="btn-modal-confirm">확인</button>
        </div>
      </div>
    </div>
    <script src="../../shared/assets/js/js-kb/pub-change-notes.js"></script>
  </body>
</html>
