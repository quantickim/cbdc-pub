<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
    <script type="text/javascript" src="../../shared/assets/js/js-kb/app.js"></script>
  </head>
  <body class="KBB">
    <div class="page-convert-deposit-KBB">
      <!-- 상단 공통 헤더 -->
      <header class="common-header">
        <button type="button" class="btn-go-main">메인으로</button>
      </header>

      <main class="convert-deposit-main">
        <!-- 예금토큰 및 연계계좌 정보 (오프램프: 예금토큰 -> 연계계좌) -->
        <section class="account-info-section">
          <p class="account-title">
            <span class="account-title-label">예금토큰</span>
            <span class="account-title-unit">에서</span>
          </p>
          <p class="account-target">
            <span class="account-target-label">연계계좌</span>
            <span class="account-target-val">14019552327425</span>
            <span class="account-target-unit">로</span>
          </p>
        </section>

        <!-- 중앙 질문 및 전환 가능 금액 영역 -->
        <!-- <section class="convert-question-section">
 <h2 class="question-title" id="convertQuestionTitle">얼마를 전환할까요?</h2>
 <div class="available-amount-wrapper" id="availableAmountWrapper">
 <i class="icon-warning-fill" aria-hidden="true"></i>
 <span class="available-amount-label">전환 가능 금액</span>
 <span class="amount" id="maxAvailableAmount" data-max="471520">471,520</span>
 <span class="available-amount-unit">원</span>
 </div>
 </section> -->

        <!-- 중앙 질문 및 전환 가능 금액 영역 -->
        <section class="convert-question-section">
          <div class="question-title-wrapper" id="convertTitleWrapper">
            <input
              type="text"
              id="convertAmountInput"
              class="question-input"
              placeholder="얼마를 전환할까요?"
              inputmode="numeric"
              autocomplete="off"
            />
            <span class="question-title-unit" aria-hidden="true">원</span>
          </div>

          <div class="available-amount-wrapper">
            <span class="available-amount-label">전환 가능 금액</span>
            <span class="amount" id="maxAvailableAmount" data-max="471520">471,520</span>
            <span class="available-amount-unit">원</span>
          </div>
        </section>
      </main>

      <!-- 공통 하단 고정 버튼 (비활성화 상태) -->
      <div class="fixed-bottom-btn-wrapper">
        <button type="button" class="btn-confirm-bottom disabled">확인</button>
      </div>
    </div>
  </body>
</html>
