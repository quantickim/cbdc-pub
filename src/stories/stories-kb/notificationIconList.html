<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
    <script type="text/javascript" src="../../shared/assets/js/js-kb/app.js"></script>
  </head>
  <body class="KBB">
    <div class="page-icon-list-KBB">
      <main class="main-content">
        <!-- 타이틀 섹션 -->
        <section class="icon-list-title-container">
          <h2 class="icon-list-title">아이콘 리스트</h2>
        </section>

        <!-- 아이콘 목록 섹션 -->
        <section class="icon-list-container">
          <ul class="icon-guide-list">
            <!-- 1. 받기 -->
            <li class="icon-guide-item">
              <i class="icon-alarm-receive" aria-hidden="true"></i>
              <span class="icon-label">받기</span>
            </li>

            <!-- 2. 송금 -->
            <li class="icon-guide-item">
              <i class="icon-alarm-remit" aria-hidden="true"></i>
              <span class="icon-label">송금</span>
            </li>

            <!-- 3. 환불 -->
            <li class="icon-guide-item">
              <i class="icon-alarm-refund" aria-hidden="true"></i>
              <span class="icon-label">환불</span>
            </li>

            <!-- 4. 결제 -->
            <li class="icon-guide-item">
              <i class="icon-alarm-payment" aria-hidden="true"></i>
              <span class="icon-label">결제</span>
            </li>

            <!-- 5. 예금 전환 -->
            <li class="icon-guide-item">
              <i class="icon-alarm-onramp" aria-hidden="true"></i>
              <span class="icon-label">예금 전환</span>
            </li>

            <!-- 6. 전환 입금 -->
            <li class="icon-guide-item">
              <i class="icon-alarm-onramp" aria-hidden="true"></i>
              <span class="icon-label">전환 입금</span>
            </li>

            <!-- 7. 공지 -->
            <li class="icon-guide-item">
              <i class="icon-alarm-notice" aria-hidden="true"></i>
              <span class="icon-label">공지</span>
            </li>

            <!-- 8. 가입 -->
            <li class="icon-guide-item">
              <i class="icon-alarm-join" aria-hidden="true"></i>
              <span class="icon-label">가입</span>
            </li>

            <!-- 9. 알림 -->
            <li class="icon-guide-item">
              <i class="icon-alarm-common" aria-hidden="true"></i>
              <span class="icon-label">알림</span>
            </li>

            <!-- 10. 1:1문의 -->
            <li class="icon-guide-item">
              <i class="icon-alarm-help" aria-hidden="true"></i>
              <span class="icon-label">1:1문의</span>
            </li>

            <!-- 11. 안심송금 신청 -->
            <li class="icon-guide-item">
              <i class="icon-alarm-safe-remit" aria-hidden="true"></i>
              <span class="icon-label">안심송금 신청</span>
            </li>

            <!-- 12. 안심송금 완료 -->
            <li class="icon-guide-item">
              <i class="icon-alarm-safe-complete" aria-hidden="true"></i>
              <span class="icon-label">안심송금 완료</span>
            </li>

            <!-- 13. 안심송금 취소 -->
            <li class="icon-guide-item">
              <i class="icon-alarm-safe-abort" aria-hidden="true"></i>
              <span class="icon-label">안심송금 취소</span>
            </li>
          </ul>
        </section>
      </main>
    </div>
  </body>
</html>
