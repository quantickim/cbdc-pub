<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
    <script type="text/javascript" src="../../shared/assets/js/js-kb/app.js"></script>
  </head>
  <body class="KBB">
    <div class="page-remit-confirm-KBB">
      <!-- 상단 공통 헤더 -->
      <header class="common-header">
        <button type="button" class="btn-go-main">전자지갑 메인</button>
      </header>

      <main class="main-content">
        <!-- 수취인 간단 안내 영역 -->
        <section class="remit-target-summary-container">
          <h2 class="target-name-title"><strong>김한국님</strong></h2>
          <div class="target-account-wrapper">
            <span class="bank-name">KB국민</span>
            <span class="account-num val-number">012345-67-890125</span>
            <button type="button" class="btn-change-target">변경</button>
          </div>
        </section>
        <section class="convert-visual-section">
          <div class="convert-icon-flow">
            <span class="icon-circle icon-kb-bank"></span>
            <div class="icon-arrows" aria-hidden="true">
              <i class="arrow arrow-1"></i>
              <i class="arrow arrow-2"></i>
              <i class="arrow arrow-3"></i>
              <i class="arrow arrow-4"></i>
            </div>
            <span class="icon-circle icon-nh"></span>
          </div>
        </section>
        <!-- 중앙 송금 금액 강조 영역 -->
        <section class="remit-amount-confirm-container">
          <div class="remit-amount-wrapper">
            <span class="amount-val val-number">100,000</span>
            <span class="amount-unit">원을</span>
          </div>
          <p class="remit-confirm-question">송금하시겠어요?</p>
        </section>

        <!-- 하단 상세 내역 리스트 -->
        <section class="remit-detail-container">
          <ul class="remit-detail-list">
            <li class="remit-detail-item">
              <span class="detail-label">받는 분</span>
              <span class="detail-value">김한국</span>
            </li>
            <li class="remit-detail-item">
              <span class="detail-label">전자지갑 주소</span>
              <div class="detail-value text-right">
                <span class="bank-name">KB국민</span>
                <span class="wallet-address val-number">012345-67-890125</span>
              </div>
            </li>
          </ul>
        </section>
      </main>

      <!-- 하단 고정 송금 버튼 -->
      <div class="fixed-bottom-btn-wrapper">
        <button type="button" class="btn-confirm-bottom" id="btnSubmitRemit">송금하기</button>
      </div>
    </div>
    <script src="../../shared/assets/js/js-kb/pub-change-notes.js"></script>
  </body>
</html>
