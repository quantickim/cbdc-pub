<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>CBDC - 계좌비밀번호 입력</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
    <script type="text/javascript" src="../../shared/assets/js/js-kb/app.js"></script>
  </head>
  <body class="KBB">
    <!-- 계좌비밀번호 입력 바텀시트 (활성화 상태) -->
    <div class="bottom-sheet-overlay active" id="accountPasswordSheet">
      <div class="bottom-sheet-container account-password-sheet">
        <!-- 1. 헤더 -->
        <div class="bottom-sheet-header">
          <h3 class="bottom-sheet-title">계좌비밀번호</h3>
          <button type="button" class="btn-sheet-close" aria-label="닫기">
            <i class="icon-close-24" aria-hidden="true"></i>
          </button>
        </div>

        <!-- 2. 본문 영역 -->
        <div class="bottom-sheet-content">
          <!-- 4자리 비밀번호 인디케이터 도트 -->
          <div class="account-pwd-dots" aria-label="비밀번호 4자리 중 2자리 입력됨">
            <span class="pwd-dot is-filled"></span>
            <span class="pwd-dot is-filled"></span>
            <span class="pwd-dot"></span>
            <span class="pwd-dot"></span>
          </div>

          <!-- 가이드 안내 문구 -->
          <p class="account-pwd-guide">계좌비밀번호 4자리를 입력해 주세요.</p>
        </div>

        <!-- 3. 하단 보안 키패드 -->
        <section class="account-keypad-section">
          <div class="security-keypad-grid" id="accountPwdKeypad">
            <!-- 행 1 -->
            <button type="button" class="btn-keypad-num" data-key="1">1</button>
            <button type="button" class="btn-keypad-num" data-key="2">2</button>
            <button type="button" class="btn-keypad-num" data-key="3">3</button>

            <!-- 행 2 -->
            <button type="button" class="btn-keypad-num" data-key="4">4</button>
            <button type="button" class="btn-keypad-num" data-key="5">5</button>
            <button type="button" class="btn-keypad-num" data-key="6">6</button>

            <!-- 행 3 -->
            <button type="button" class="btn-keypad-num" data-key="7">7</button>
            <button type="button" class="btn-keypad-num" data-key="8">8</button>
            <button type="button" class="btn-keypad-num" data-key="9">9</button>

            <!-- 행 4 (좌측 재배열 / 중앙 0 / 우측 지우기) -->
            <button type="button" class="btn-keypad-action btn-rearrange" data-key="refresh" aria-label="키패드 재배열">
              <i class="icon-refresh-black-24" aria-hidden="true"></i>
            </button>
            <button type="button" class="btn-keypad-num" data-key="0">0</button>
            <button type="button" class="btn-keypad-action btn-backspace" data-key="back" aria-label="한 글자 지우기">
              <i class="icon-arrow-left-thin" aria-hidden="true"></i>
            </button>
          </div>
        </section>
      </div>
    </div>
  </body>
</html>
