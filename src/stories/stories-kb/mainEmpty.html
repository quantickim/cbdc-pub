<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
  </head>
  <body class="KBB">
    <div class="page-main-KBB">
      <!-- 상단 네비게이션 헤더 -->
      <header>
        <div class="common-header">
          <button type="button" class="btn-go-main">국민지갑 메인</button>
        </div>
      </header>
      <main class="main-content">
        <!-- 메인 지갑 카드 -->
        <section class="main-wallet-container">
          <div class="main-wallet-card">
            <div class="main-wallet-card-top">
              <div class="main-wallet-title-container row-wrapper">
                <div class="main-wallet-left-wrapper">
                  <i class="icon-main-wallet-account" aria-hidden="true"></i>
                  <div class="main-wallet-title-wrapper">
                    <div class="main-wallet-title-content">
                      <span class="main-wallet-title">김국민님 지갑</span>
                    </div>
                    <div class="main-wallet-account-wrapper">
                      <p class="main-wallet-account">823401-01-123456</p>
                      <button type="button" class="btn-main-wallet-copy" aria-label="계좌복사하기">
                        <i class="icon-main-wallet-copy" aria-hidden="true"></i>
                      </button>
                    </div>
                  </div>
                </div>
                <div class="main-wallet-right-wrapper">
                  <button type="button" class="btn-main-alarm" aria-label="알림진입하기">
                    <i class="icon-main-alarm" aria-hidden="true"></i>
                    <i class="icon-main-alarm-noti" aria-hidden="true"></i>
                  </button>
                  <button type="button" class="btn-main-setting" aria-label="설정진입하기">
                    <i class="icon-main-setting" aria-hidden="true"></i>
                  </button>
                </div>
              </div>

              <!-- 잔액 숨김 상태 (시안 반영) -->
              <div class="main-wallet-token-container is-hidden">
                <span class="main-wallet-token-name">예금 토큰</span>
                <span class="main-wallet-token-hidden-text">잔액 숨김</span>
                <button type="button" class="btn-main-wallet-token-toggle">보기</button>
              </div>
            </div>

            <!-- 전환 / 송금 버튼 -->
            <div class="main-wallet-card-middle">
              <button type="button" class="btn-main-wallet-convert" aria-label="전환진입하기">전환</button>
              <button type="button" class="btn-main-wallet-transfer" aria-label="송금진입하기">송금</button>
            </div>

            <!-- 내 바우처 바로가기 -->
            <div class="main-wallet-card-bottom">
              <button type="button" class="btn-main-wallet-voucher" aria-label="내바우처진입하기">
                <span class="main-wallet-link-voucher">내 바우처 바로가기</span>
                <i class="icon-main-wallet-arrow" aria-hidden="true"></i>
              </button>
            </div>
          </div>
        </section>

        <!-- QR스캔 / QR보여주기 / 사용처 찾아보기 (3개 카드) -->
        <section class="main-qrshop-container">
          <button type="button" class="btn-main-link-wrapper" aria-label="QR스캔하기">
            <span class="main-link-title">QR<br />스캔하기</span>
            <i class="icon-main-link-qrscan" aria-hidden="true"></i>
          </button>
          <button type="button" class="btn-main-link-wrapper" aria-label="QR보여주기">
            <span class="main-link-title">QR<br />보여주기</span>
            <i class="icon-main-link-qrshow" aria-hidden="true"></i>
          </button>
          <button type="button" class="btn-main-link-wrapper" aria-label="사용처 찾아보기">
            <span class="main-link-title">사용처<br />찾아보기</span>
            <i class="icon-main-link-qrshop" aria-hidden="true"></i>
          </button>
        </section>

        <!-- 최근 이용내역 (Empty State) -->
        <section class="main-transactions-container">
          <div class="main-transactions-card">
            <div class="main-transactions-title-wrapper">
              <span class="main-transactions-title">최근 이용내역</span>
              <button type="button" class="btn-main-transactions-more">
                <span class="main-transactions-more">더보기</span>
                <i class="icon-main-transactions-more" aria-hidden="true"></i>
              </button>
            </div>
            <div class="main-empty-state">
              <p class="empty-text">최근 이용내역이 없습니다.</p>
            </div>
          </div>
        </section>

        <!-- 공지사항 (Empty State) -->
        <section class="main-notice-container">
          <div class="main-notice-card">
            <div class="main-notice-title-wrapper">
              <span class="main-notice-title">공지사항</span>
              <button type="button" class="btn-main-notice-more">
                <span class="main-notice-more">더보기</span>
                <i class="icon-main-notice-more" aria-hidden="true"></i>
              </button>
            </div>
            <div class="main-empty-state">
              <p class="empty-text">등록된 공지사항이 없습니다.</p>
            </div>
          </div>
        </section>

        <!-- 예금자 보호법 안내 (시안: 1억원) -->
        <section class="main-law-container">
          <i class="icon-main-law" aria-hidden="true"></i>
          <p class="main-law-info">
            예금 토큰은 예금자보호법에 따라 원금과 소정의 이자를 합하여 1인당 “1억원까지”(본 은행의 여타 보호상품과
            합산) 보호됩니다.
          </p>
        </section>
      </main>
    </div>
  </body>
</html>
