<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
  </head>
  <body class="KBB">
    <div class="page-qr-pay-amount-KBB">
      <!-- 상단 공통 헤더 -->
      <header class="common-header">
        <button type="button" class="btn-go-main">전자지갑 메인</button>
      </header>

      <main class="qr-pay-amount-main">
        <!-- 타이틀 -->
        <section class="pay-amount-title-container">
          <h2 class="pay-title">
            스피카 나폴리 합정에서<br />
            얼마를 결제하시겠어요?
          </h2>
        </section>

        <!-- 결제 금액 입력 카드 -->
        <section class="pay-amount-card">
          <div class="input-amount-wrapper">
            <span class="label-amount">결제 금액</span>
            <div class="input-amount-field">
              <input type="text" class="input-amount-number" placeholder="숫자만 입력" value="50,000" />
              <span class="unit-won">원</span>
            </div>
          </div>
          <!-- 결제 가능 금액보다 크게 입력하고 '다음'을 누르면 안내 문구 자리에 오류 문구 (자동충전 미설정 지갑) -->
          <div class="common-error-message">
            <i class="icon-warning-red" aria-hidden="true"></i>
            <span class="error-text">결제 가능 금액을 확인해주세요</span>
          </div>
        </section>

        <!-- 결제 수단 섹션 -->
        <section class="pay-method-container">
          <h3 class="pay-method-title">예금 토큰 잔액</h3>
          <div class="pay-account-item">
            <i class="icon-token-account" aria-hidden="true"></i>
            <div class="account-info-wrapper">
              <span class="bank-name">KB국민</span>
              <span class="account-number">012345-67-890157</span>
              <div class="available-balance-wrapper">
                <!-- '결제 가능 금액' 라벨 제거 (스토리보드 0.7 98p 3번) -->
                <span class="amount">500,000</span>
                <span class="available-balance-unit">원</span>
              </div>
            </div>
          </div>
        </section>
      </main>

      <!-- 공통 하단 고정 버튼 (활성화 상태: disabled 제거) -->
      <div class="fixed-bottom-btn-wrapper">
        <button type="button" class="btn-confirm-bottom">다음</button>
      </div>
    </div>
    <script src="../../shared/assets/js/js-kb/pub-change-notes.js"></script>
  </body>
</html>
