<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
  </head>
  <body class="KBB">
    <div class="page-qr-pay-amount-KBB">
      <!-- 상단 공통 헤더 -->
      <header class="common-header">
        <button type="button" class="btn-go-main">메인으로</button>
      </header>

      <main class="qr-pay-amount-main">
        <!-- 타이틀 -->
        <section class="pay-amount-title-container">
          <h2 class="pay-title">
            스피카 나폴리 합정에서<br />
            얼마를 결제할까요?
          </h2>
        </section>

        <!-- 결제 금액 입력 카드 -->
        <section class="pay-amount-card">
          <div class="input-amount-wrapper">
            <span class="label-amount">결제 금액</span>
            <div class="input-amount-field">
              <input type="text" class="input-amount-number" placeholder="숫자만 입력" value="50,000" />
              <span class="unit-won">원</span>
            </div>
          </div>
          <div class="pay-amount-caption">
            <i class="icon-caption-info" aria-hidden="true"></i>
            <span class="caption-text">결제는 예금토큰으로만 가능합니다</span>
          </div>
        </section>

        <!-- 결제 수단 섹션 -->
        <section class="pay-method-container">
          <h3 class="pay-method-title">예금 토큰</h3>
          <div class="pay-account-item">
            <i class="icon-token-account" aria-hidden="true"></i>
            <div class="account-info-wrapper">
              <span class="bank-name">국민</span>
              <span class="account-number">123456-12-123456</span>
              <div class="available-balance-wrapper">
                <span class="available-balance-label">결제 가능 금액</span>
                <span class="amount">500,000</span>
                <span class="available-balance-unit">원</span>
              </div>
            </div>
          </div>
        </section>
      </main>

      <!-- 공통 하단 고정 버튼 (활성화 상태: disabled 제거) -->
      <div class="fixed-bottom-btn-wrapper">
        <button type="button" class="btn-confirm-bottom">확인</button>
      </div>
    </div>
  </body>
</html>
