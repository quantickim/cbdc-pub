    <div class="page-convert-deposit-KBB">
      <!-- 상단 공통 헤더 -->
      <header class="common-header">
        <button type="button" class="btn-go-main">메인으로</button>
      </header>

      <main class="convert-deposit-main">
        <!-- 연계계좌 정보 -->
        <section class="account-info-section">
          <p class="account-title">
            <span class="label">연계계좌</span>
            <span class="val">(14019552327425)</span>
            <span class="unit">에서</span>
          </p>
          <p class="account-balance">
            <span class="label">잔고 :</span>
            <span class="val">10,000,000</span>
            <span class="unit">원</span>
          </p>
        </section>
        <!-- 중앙 질문 및 전환 가능 금액 영역 (초기값 20,000 세팅 및 has-value 부여) -->
        <section class="convert-question-section">
          <div class="question-title-wrapper has-value" id="convertTitleWrapper">
            <input
              type="text"
              id="convertAmountInput"
              class="question-input"
              value="20,000"
              placeholder="얼마를 전환할까요?"
              inputmode="numeric"
              autocomplete="off"
            />
            <span class="unit" aria-hidden="true">원</span>
          </div>

          <div class="available-amount-wrapper">
            <span class="label">전환 가능 금액</span>
            <span class="amount" id="maxAvailableAmount" data-max="471520">471,520</span>
            <span class="unit">원</span>
          </div>
        </section>
