<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>CBDC - 가맹점 상세</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
  </head>
  <body class="KBB">
    <!-- 가맹점 상세 정보 바텀시트 (활성화 상태) -->
    <div class="bottom-sheet-overlay sheet-map-merchant active" id="merchantDetailSheet">
      <div class="bottom-sheet-container merchant-detail-sheet">
        <!-- 1. 바텀시트 헤더 -->
        <div class="bottom-sheet-header">
          <h3 class="bottom-sheet-title">파리크라상 여의도점</h3>
          <button type="button" class="btn-sheet-close" aria-label="닫기">
            <i class="icon-close-24" aria-hidden="true"></i>
          </button>
        </div>

        <!-- 2. 바텀시트 본문 스크롤 영역 -->
        <div class="bottom-sheet-content">
          <!-- 미니 지도 프리뷰 박스 -->
          <div class="merchant-mini-map">
            <div class="mini-map-canvas" id="detailMiniMap">
              <!-- 식당/베이커리 핑 핀 -->
              <div class="map-fork-marker" style="top: 55%; left: 50%">
                <div class="marker-head">
                  <i class="icon-fork-spoon" aria-hidden="true"></i>
                </div>
              </div>
            </div>
          </div>

          <!-- 정보 데이터 리스트 -->
          <dl class="merchant-info-list">
            <div class="info-row">
              <dt class="info-label">주소</dt>
              <dd class="info-value">서울 영등포구 국제금융로8길 26</dd>
            </div>
            <div class="info-row">
              <dt class="info-label">전화번호</dt>
              <dd class="info-value val-number">02-111-1111</dd>
            </div>
            <div class="info-row">
              <dt class="info-label">업종</dt>
              <dd class="info-value">베이커리</dd>
            </div>
            <div class="info-row row-voucher">
              <dt class="info-label">사용가능 바우처</dt>
              <dd class="info-value text-right">
                국민서울사랑바우처, 대한민국화이팅<br />
                바우처, 여의도사랑바우처, 캐시백<br />
                룰루랄라
              </dd>
            </div>
          </dl>

          <!-- 정보 더보기 링크 -->
          <div class="merchant-more-action">
            <button type="button" class="btn-info-more">
              <span>정보 더보기</span>
              <i class="icon-arrow-right-16" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
