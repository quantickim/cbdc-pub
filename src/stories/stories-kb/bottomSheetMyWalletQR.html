<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />

  <body class="KBB">
    <!-- 바텀시트 딤 오버레이 (스토리보드 0.7 61p 1) -->
    <div class="bottom-sheet-overlay active">
      <div class="bottom-sheet-container wallet-qr-sheet">
        <div class="bottom-sheet-header">
          <h3 class="bottom-sheet-title">내 지갑 QR</h3>
          <button type="button" class="btn-sheet-close" aria-label="닫기"></button>
        </div>

        <div class="bottom-sheet-content">
          <div class="wallet-qr-sheet-content">
            <!-- 실제 QR 은 앱에서 지갑 주소로 그린다 (예시 이미지) -->
            <div class="wallet-qr-image">
              <svg viewBox="0 0 21 21" width="160" height="160" aria-label="내 지갑 QR코드" shape-rendering="crispEdges">
                <path fill="#000" d="M0 0h7v7H0zM14 0h7v7h-7zM0 14h7v7H0z" />
                <path fill="#fff" d="M1 1h5v5H1zM15 1h5v5h-5zM1 15h5v5H1z" />
                <path fill="#000" d="M2 2h3v3H2zM16 2h3v3h-3zM2 16h3v3H2zM8 1h1v2H8zM10 0h2v1h-2zM9 4h3v1H9zM8 8h2v2H8zM11 8h3v1h-3zM15 9h2v2h-2zM18 8h3v1h-3zM9 11h1v3H9zM12 11h3v2h-3zM8 15h2v1H8zM11 15h1v3h-1zM14 14h2v2h-2zM17 13h2v1h-2zM19 15h2v2h-2zM13 18h3v1h-3zM17 18h1v3h-1zM9 18h1v2H9zM0 8h2v1H0zM3 9h3v1H3zM1 11h2v2H1zM5 12h2v1H5z" />
              </svg>
            </div>
            <p class="wallet-qr-guide">
              상대방이 이 QR을 스캔하면
              <br />
              나에게 송금할 수 있어요.
            </p>
          </div>
        </div>
      </div>
    </div>
    <script src="../../shared/assets/js/js-kb/pub-change-notes.js"></script>
  </body>
</html>
