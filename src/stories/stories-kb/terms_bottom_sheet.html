<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <title>CBDC - 이용 약관 동의</title>
    <link rel="stylesheet" href="../../shared/assets/styles/common.css" />
    <link rel="stylesheet" href="../../shared/assets/styles/style.css" />
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
    <script type="text/javascript" src="../../shared/assets/js/js-kb/app.js"></script>
  </head>
  <body class="KBB">
    <div class="bottom-sheet-overlay sheet-terms-agree" role="dialog" aria-modal="true">
      <div class="bottom-sheet-container">
        <!-- 1. 헤더 (타이틀 및 닫기 버튼) -->
        <div class="bottom-sheet-header">
          <h2 class="bottom-sheet-title">이용 약관 동의</h2>
          <button type="button" class="btn-sheet-close" aria-label="닫기"></button>
        </div>

        <!-- 2. 약관 체크 및 트리 목록 -->
        <div class="bottom-sheet-content">
          <div class="terms-agree-container">
            <!-- 약관 전체 필수동의 -->
            <div class="terms-all-check">
              <label class="terms-check-label">
                <input type="checkbox" class="check-input" />
                <span class="custom-checkbox"></span>
                <span class="terms-label-text">약관 필수동의</span>
              </label>
              <button type="button" class="btn-terms-detail" aria-label="약관 필수동의 상세 보기"></button>
            </div>

            <!-- 개별 약관 목록 -->
            <ul class="terms-depth-list">
              <!-- 그룹 약관 (서브 계층 포함) -->
              <li class="terms-group-item is-open">
                <div class="terms-row">
                  <label class="terms-check-label">
                    <input type="checkbox" class="check-input" checked />
                    <span class="custom-checkbox"></span>
                    <span class="terms-label-text">자동 충전 서비스 이용약관</span>
                  </label>
                  <button type="button" class="btn-terms-fold" aria-label="서브 약관 접기/펼치기"></button>
                </div>

                <!-- 서브 자식 약관 -->
                <ul class="terms-sub-list">
                  <li class="terms-sub-item">
                    <label class="terms-check-label">
                      <input type="checkbox" class="check-input" checked />
                      <span class="custom-checkbox"></span>
                      <span class="terms-label-text">회원 이용 약관</span>
                    </label>
                    <button type="button" class="btn-terms-detail" aria-label="회원 이용 약관 상세 보기"></button>
                  </li>
                </ul>
              </li>

              <!-- 단일 약관 -->
              <li class="terms-group-item">
                <div class="terms-row">
                  <label class="terms-check-label">
                    <input type="checkbox" class="check-input" checked />
                    <span class="custom-checkbox"></span>
                    <span class="terms-label-text">앱 이용약관</span>
                  </label>
                  <button type="button" class="btn-terms-detail" aria-label="앱 이용약관 상세 보기"></button>
                </div>
              </li>
            </ul>
          </div>
        </div>

        <!-- 3. 하단 취소(4) / 확인(6) 버튼 -->
        <div class="bottom-sheet-footer">
          <button type="button" class="btn-sheet-cancel">취소</button>
          <button type="button" class="btn-sheet-confirm">확인</button>
        </div>
      </div>
    </div>
  </body>
</html>
