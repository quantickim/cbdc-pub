<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/common.css" />
    <link rel="stylesheet" href="../../shared/assets/styles/style.css" />
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
    <script type="text/javascript" src="../../shared/assets/js/js-kb/app.js"></script>
  </head>
  <body class="KBB">
    <!-- 결제 금액 입력 키패드 바텀시트 -->
    <div class="bottom-sheet-overlay active" id="keypadSheet">
      <div class="bottom-sheet-container keypad-sheet-container">
        <!-- 헤더 -->
        <div class="bottom-sheet-header">
          <h3 class="bottom-sheet-title">결제 금액</h3>
          <button type="button" class="btn-sheet-close" id="btnKeypadClose" aria-label="닫기"></button>
        </div>

        <!-- 본문 -->
        <div class="bottom-sheet-content">
          <!-- 금액 인풋/디스플레이 영역 (좌우 여백을 위해 래퍼 유지) -->
          <div class="keypad-amount-display-wrapper">
            <div class="keypad-amount-display">
              <span class="amount-val" id="keypadAmountVal">0</span>
              <span class="amount-unit">원</span>
            </div>
          </div>

          <!-- 공통 가상 숫자 키패드 그리드 -->
          <div class="common-keypad-grid" id="keypadGrid">
            <button type="button" class="btn-key" data-key="1">1</button>
            <button type="button" class="btn-key" data-key="2">2</button>
            <button type="button" class="btn-key" data-key="3">3</button>
            <button type="button" class="btn-key" data-key="4">4</button>
            <button type="button" class="btn-key" data-key="5">5</button>
            <button type="button" class="btn-key" data-key="6">6</button>
            <button type="button" class="btn-key" data-key="7">7</button>
            <button type="button" class="btn-key" data-key="8">8</button>
            <button type="button" class="btn-key" data-key="9">9</button>
            <button type="button" class="btn-key" data-key="00">00</button>
            <button type="button" class="btn-key" data-key="0">0</button>
            <button type="button" class="btn-key btn-key-delete" data-key="delete" aria-label="지우기">
              <i class="icon-keypad-delete" aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <!-- 하단 확인 버튼 -->
        <div class="bottom-sheet-footer">
          <button type="button" class="btn-sheet-confirm disabled" id="btnKeypadConfirm">확인</button>
        </div>
      </div>
    </div>

    <!-- 공통 키패드 모듈 연동 스크립트 -->
  </body>
</html>
