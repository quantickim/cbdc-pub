<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
    <script type="text/javascript" src="../../shared/assets/js/js-kb/app.js"></script>
  </head>
  <body class="KBB">
    <div class="page-convert-complete-KBB">
      <!-- 상단 공통 헤더 -->
      <header class="common-header">
        <button type="button" class="btn-go-main">메인으로</button>
      </header>

      <main class="convert-complete-main">
        <!-- 상단 완료 체크 비주얼 및 타이틀 -->
        <section class="convert-visual-section">
          <div class="complete-status-icon">
            <i class="icon-check-yellow" aria-hidden="true"></i>
          </div>
          <h2 class="convert-complete-title">송금을 완료했어요</h2>

          <div class="convert-complete-amount">
            <span class="amount">20,000</span><span class="convert-complete-unit">원</span>
          </div>
        </section>

        <!-- 전환 상세 내역 리스트 -->
        <section class="convert-info-section">
          <ul class="convert-info-list">
            <li class="convert-info-item">
              <span class="convert-info-label">거래구분</span>
              <span class="value">송금</span>
            </li>
            <li class="convert-info-item">
              <span class="convert-info-label">이용 지갑</span>
              <span class="value">123456-78-901345</span>
            </li>
            <li class="convert-info-item">
              <span class="convert-info-label">수취인 명</span>
              <span class="value">김한국</span>
            </li>
            <li class="convert-info-item">
              <span class="convert-info-label">수취인예금 토큰<br />전자지갑</span>
              <span class="value account-text">
                국민<br />
                <span class="account-num">14019552327425</span>
              </span>
            </li>
          </ul>

          <!-- 하단 안내 문구 -->
          <div class="convert-notice-message">
            <i class="icon-caption-info" aria-hidden="true"></i>
            <span>이용 내역 반영까지 최대 5분이 소요 될 수 있습니다.</span>
          </div>
        </section>
      </main>

      <!-- 공통 하단 고정 버튼 (2버튼) -->
      <div class="fixed-bottom-dual-btn-wrapper">
        <button type="button" class="btn-dual-cancel">내역 보기</button>
        <button type="button" class="btn-dual-confirm">확인</button>
      </div>
    </div>
  </body>
</html>
