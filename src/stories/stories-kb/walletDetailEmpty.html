<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
  </head>
  <body class="KBB">
    <div class="page-wallet-detail-KBB">
      <header>
        <div class="common-header">
          <button type="button" class="btn-go-main">메인으로</button>
        </div>
      </header>
      <main>
        <section class="wallet-detail-container">
          <div class="wallet-detail-account-info">
            <div class="wallet-detail-title-wrapper">
              <h4 class="wallet-detail-title">내 지갑</h4>
            </div>
            <div class="wallet-detail-address-wrapper">
              <span class="wallet-detail-address">371102-04-140099</span>
              <button type="button" aria-label="복사하기" class="btn-wallet-detail-copy">
                <i class="icon-wallet-detail-copy" aria-hidden="true"></i>
              </button>
            </div>
            <div class="wallet-detail-account-wrapper">
              <span class="wallet-detail-account-label">연계계좌</span>
              <span class="wallet-detail-account-value">123456-78-901234</span>
            </div>
          </div>
          <div class="wallet-detail-more-wrapper">
            <button type="button" aria-label="더보기" class="btn-wallet-detail-more">
              <i aria-hidden="true" class="icon-wallet-detail-more"></i>
            </button>
          </div>
        </section>
        <section class="wallet-detail-token-container">
          <span class="wallet-detail-token-title">예금 토큰</span>
          <span class="wallet-detail-token-value"
            >0
            <span class="wallet-detail-token-won">원</span>
          </span>
        </section>
        <section class="wallet-detail-action-container">
          <div class="wallet-detail-action-top">
            <button aria-label="전환입금하기" type="button" class="btn-wallet-detail-action">전환입금</button>
            <button aria-label="예금전환하기" type="button" class="btn-wallet-detail-action">예금전환</button>
            <button aria-label="송금" type="button" class="btn-wallet-detail-action transfer">송금</button>
          </div>
          <div class="wallet-detail-action-bottom">
            <button type="button" class="btn-wallet-detail-qr">
              <span class="wallet-detail-qr-title"> QR 결제하기 </span>
              <i aria-hidden="true" class="icon-wallet-detail-qr"> </i>
            </button>
          </div>
        </section>
        <section class="wallet-detail-filter-container">
          <div class="wallet-detail-filter-top">
            <button aria-label="검색하기" class="btn-wallet-detail-search">
              <i aria-hidden="true" class="icon-wallet-detail-search"></i>
            </button>
            <div class="wallet-detail-date-wrapper">
              <button type="button" class="btn-wallet-detail-date">
                <span class="wallet-detail-date"
                  >2025<span class="kbfg-text">년</span> 8<span class="kbfg-text">월</span>
                </span>
                <i class="icon-wallet-detail-date-down"></i>
              </button>
            </div>
          </div>
          <div class="wallet-detail-filter-bottom">
            <button type="button" class="btn-wallet-detail-filter active">
              <span class="wallet-detail-filter">전체</span>
            </button>
            <button type="button" class="btn-wallet-detail-filter">
              <span class="wallet-detail-filter">받기</span>
            </button>
            <button type="button" class="btn-wallet-detail-filter">
              <span class="wallet-detail-filter">결제</span>
            </button>
            <button type="button" class="btn-wallet-detail-filter">
              <span class="wallet-detail-filter">캐시백</span>
            </button>
            <button type="button" class="btn-wallet-detail-filter">
              <span class="wallet-detail-filter">환불</span>
            </button>
            <button type="button" class="btn-wallet-detail-filter">
              <span class="wallet-detail-filter">전환입금</span>
            </button>
            <button type="button" class="btn-wallet-detail-filter">
              <span class="wallet-detail-filter">예금전환</span>
            </button>
            <button type="button" class="btn-wallet-detail-filter">
              <span class="wallet-detail-filter">송금</span>
            </button>
          </div>
        </section>
        <section class="wallet-detail-history-container">
          <div class="main-empty-state">
            <p class="empty-text">이용내역이 없습니다.</p>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
