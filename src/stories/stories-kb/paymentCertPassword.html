<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <title>KB국민은행 - 간편비밀번호 입력</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
    <script type="text/javascript" src="../../shared/assets/js/js-kb/app.js"></script>
  </head>
  <body class="KBB">
    <div class="page-auth-pin-KBB">
      <!-- 상단 공통 헤더 -->
      <header class="common-header">
        <button type="button" class="btn-go-main">메인으로</button>
      </header>

      <main class="auth-main-content">
        <!-- 메인 타이틀 -->
        <h2 class="auth-pin-title">간편비밀번호 입력</h2>

        <!-- 6자리 비밀번호 인디케이터 도트 -->
        <div class="auth-pin-dots-wrapper" aria-label="비밀번호 6자리 중 3자리 입력됨">
          <span class="pin-dot is-filled"></span>
          <span class="pin-dot is-filled"></span>
          <span class="pin-dot is-filled"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
          <span class="pin-dot"></span>
        </div>

        <!-- 안내 문구 -->
        <p class="auth-pin-guide">비밀번호 6자리를 입력해주세요</p>

        <!-- 하단 비밀번호 찾기 링크 -->
        <div class="auth-pin-find-wrapper">
          <a href="javascript:void(0);" class="link-find-password">비밀번호를 잊으셨나요?</a>
        </div>
      </main>

      <!-- 하단 고정 보안 키패드 영역 -->
      <section class="auth-keypad-bottom-sheet">
        <div class="security-keypad-grid" id="authPinKeypad">
          <!-- 행 1 -->
          <button type="button" class="btn-keypad-num" data-key="1">1</button>
          <button type="button" class="btn-keypad-num" data-key="3">3</button>
          <button type="button" class="btn-keypad-num" data-key="2">2</button>

          <!-- 행 2 -->
          <button type="button" class="btn-keypad-num" data-key="8">8</button>
          <button type="button" class="btn-keypad-num" data-key="7">7</button>
          <button type="button" class="btn-keypad-num" data-key="6">6</button>

          <!-- 행 3 -->
          <button type="button" class="btn-keypad-num" data-key="5">5</button>
          <button type="button" class="btn-keypad-num" data-key="4">4</button>
          <button type="button" class="btn-keypad-num" data-key="0">0</button>

          <!-- 행 4 (액션 행) -->
          <button type="button" class="btn-keypad-action btn-backspace" data-key="back" aria-label="지우기">
            <i class="icon-arrow-left-back" aria-hidden="true"></i>
          </button>
          <button type="button" class="btn-keypad-num" data-key="9">9</button>
          <button type="button" class="btn-keypad-action btn-confirm-pin" data-key="confirm">확인</button>
        </div>
      </section>
    </div>
  </body>
</html>
