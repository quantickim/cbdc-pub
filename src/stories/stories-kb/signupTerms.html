    <script>
      document.addEventListener('DOMContentLoaded', function () {
        // 1. 그룹 카드 열기/닫기
        document.querySelectorAll('.btn-terms-group-toggle').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var card = btn.closest('.terms-group-card');
            card.classList.toggle('is-open');
            btn.setAttribute('aria-expanded', card.classList.contains('is-open'));
          });
        });

        // 2. 상세 항목 열기/닫기
        document.querySelectorAll('.btn-terms-detail-toggle').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var container = btn.closest('.terms-detail-container');
            container.classList.toggle('is-open');
          });
        });

        // 3. 그룹 최상단 체크박스 → 하위 전체 체크
        document.querySelectorAll('.terms-group-header-wrapper .custom-terms-check-input').forEach(function (groupChk) {
          groupChk.addEventListener('change', function () {
            var card = groupChk.closest('.terms-group-card');
            var subChks = card.querySelectorAll('.terms-group-content-wrapper .custom-terms-check-input');
            subChks.forEach(function (chk) {
              chk.checked = groupChk.checked;
            });
          });
        });

        // 4. 하위 체크박스 변경 시 그룹 체크박스 동기화
        document.querySelectorAll('.terms-group-content-wrapper .custom-terms-check-input').forEach(function (subChk) {
          subChk.addEventListener('change', function () {
            var card = subChk.closest('.terms-group-card');
            var groupChk = card.querySelector('.terms-group-header-wrapper .custom-terms-check-input');
            var allSubs = card.querySelectorAll('.terms-group-content-wrapper .custom-terms-check-input');
            var allChecked = Array.prototype.every.call(allSubs, function (chk) {
              return chk.checked;
            });
            groupChk.checked = allChecked;
          });
        });
      });
    </script>
