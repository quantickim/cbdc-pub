<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
  </head>
  <body class="KBB">
    <!-- 바텀시트 딤 오버레이 -->
    <div class="bottom-sheet-overlay active">
      <div class="bottom-sheet-container">
        <!-- 상단 헤더 -->
        <div class="bottom-sheet-header">
          <h3 class="bottom-sheet-title">내 지갑 설정</h3>
          <button type="button" class="btn-sheet-close" aria-label="닫기"></button>
        </div>

        <!-- 본문 콘텐츠 (메뉴 리스트) -->
        <div class="bottom-sheet-content">
          <ul class="select-menu-list">
            <li class="select-menu-item">
              <button type="button" class="btn-menu-link">자동충전/출금 설정</button>
            </li>
            <li class="select-menu-item">
              <button type="button" class="btn-menu-link">사업자 계정으로 전환</button>
            </li>
            <li class="select-menu-item">
              <button type="button" class="btn-menu-link">전자지갑 삭제</button>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </body>
</html>
