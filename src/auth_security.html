<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>CBDC - 인증/보안</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
    <script type="text/javascript" src="../../shared/assets/js/js-kb/app.js"></script>
  </head>
  <body class="page-auth-security-KBB KBB">
    <!-- 공통 헤더 규격 -->
    <header>
      <div class="common-header">
        <button type="button" class="btn-go-main">메인으로</button>
      </div>
    </header>

    <main>
      <section class="security-list-container">
        <!-- 1. 간편 비밀번호 재설정 -->
        <div class="security-item is-link" data-href="pin_reset.html">
          <div class="item-text-wrapper">
            <p class="item-title">간편 비밀번호 재설정</p>
          </div>
          <button type="button" class="btn-arrow" aria-label="이동"></button>
        </div>

        <!-- 2. 지문인증 설정 -->
        <div class="security-item">
          <div class="item-text-wrapper">
            <p class="item-title">지문인증 설정</p>
            <p class="item-desc">지문을 활용하여 인증을 간편하게 할 수 있어요.</p>
          </div>
          <label class="common-switch" for="switchFingerprint">
            <input type="checkbox" id="switchFingerprint" class="switch-input" />
            <span class="switch-track">
              <span class="switch-thumb"></span>
            </span>
          </label>
        </div>

        <!-- 3. 얼굴인증 설정 -->
        <div class="security-item">
          <div class="item-text-wrapper">
            <p class="item-title">얼굴인증 설정</p>
            <p class="item-desc">얼굴을 활용하여 인증을 간편하게 할 수 있어요.</p>
          </div>
          <label class="common-switch" for="switchFace">
            <input type="checkbox" id="switchFace" class="switch-input" />
            <span class="switch-track">
              <span class="switch-thumb"></span>
            </span>
          </label>
        </div>

        <!-- 4. 토큰 잔액 숨기기 -->
        <div class="security-item">
          <div class="item-text-wrapper">
            <p class="item-title">토큰 잔액 숨기기</p>
            <p class="item-desc">설정 시, 앱 화면에서 잔액이 숨겨져요.</p>
          </div>
          <label class="common-switch" for="switchHideBalance">
            <input type="checkbox" id="switchHideBalance" class="switch-input" />
            <span class="switch-track">
              <span class="switch-thumb"></span>
            </span>
          </label>
        </div>
      </section>
    </main>
  </body>
</html>
