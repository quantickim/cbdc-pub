<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1.0,user-scalable=no,maximum-scale=1,width=device-width" />
    <meta name="format-detection" content="telephone=no, address=no, email=no" />
    <title>CBDC - APP</title>
    <link rel="stylesheet" href="../../shared/assets/styles/kb.css" />
    <script type="text/javascript" src="../../shared/assets/js/js-kb/app.js"></script>
  </head>
  <body class="KBB">
    <!-- 지갑주소 입력 가상 키패드 바텀시트 -->
    <div class="bottom-sheet-overlay active" id="walletAddressSheet">
      <div class="bottom-sheet-container wallet-address-sheet-container">
        <!-- 헤더 -->
        <div class="bottom-sheet-header">
          <h3 class="bottom-sheet-title">지갑주소</h3>
          <button type="button" class="btn-sheet-close" id="btnWalletSheetClose" aria-label="닫기"></button>
        </div>

        <!-- 본문 (디스플레이) -->
        <div class="bottom-sheet-content">
          <div class="keypad-amount-display-wrapper">
            <div class="common-input-field">
              <input
                type="text"
                id="keypadAmountVal"
                class="common-form-input"
                value="123456789012345678"
                maxlength="18"
                inputmode="numeric"
                placeholder="지갑주소를 입력해주세요"
              />
              <button type="button" class="btn-input-clear" id="btnWalletInputClear" aria-label="입력 내용 지우기">
                <i class="icon-input-clear" aria-hidden="true"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- 하단 단일 확인 버튼 (공통 bottom-sheet-footer) -->
        <div class="bottom-sheet-footer">
          <button type="button" class="btn-sheet-confirm disabled" id="btnWalletAddressConfirm" disabled>확인</button>
        </div>
      </div>
    </div>
  </body>
</html>
