    <script>
      (function () {
        var promiseChain = Promise.resolve();
        var callbacks = {};
        var callbackTimeoutMs = 5 * 60 * 1000;
        var takeCallback = function (msgId) {
          var callback = callbacks[msgId];
          if (!callback) {
            return;
          }

          delete callbacks[msgId];
          window.clearTimeout(callback.timeoutId);
          return callback;
        };
        var init = function () {
          const guid = function () {
            function s4() {
              return Math.floor((1 + Math.random()) * 0x10000)
                .toString(16)
                .substring(1);
            }

            return s4() + s4() + '-' + s4() + '-' + s4() + '-' + s4() + '-' + s4() + s4() + s4();
          };

          window.webViewBridge = {
            send: function (targetFunc, data) {
              var data = data || {};
              var msgObj = {
                targetFunc: targetFunc,
                data: data,
              };

              if (data.success || data.error) {
                msgObj.msgId = guid();
              }

              var msg = JSON.stringify(msgObj);

              promiseChain = promiseChain
                .then(function () {
                  return new Promise(function (resolve, reject) {
                    if (msgObj.msgId && window.ReactNativeWebView) {
                      callbacks[msgObj.msgId] = {
                        onsuccess: data.success,
                        onerror: data.error,
                        timeoutId: window.setTimeout(function () {
                          delete callbacks[msgObj.msgId];
                        }, callbackTimeoutMs),
                      };
                    }
                    // 로컬환경에서 테스트 위해서 추가
                    if (!window.ReactNativeWebView) {
                      data.success && data.success.call(null, { isSuccessful: true });
                    }

                    if (window.ReactNativeWebView) {
                      window.ReactNativeWebView.postMessage(msg);
                    }
                    resolve();
                  });
                })
                .catch(function (e) {
                  console.error('메세지 실패 ' + e.message);
                });
            },
          };

          const listener = (e) => {
            var message;
            try {
              message = JSON.parse(e.data);
            } catch (err) {
              console.error('메세지를 파싱할수 없음 ' + err);
              return;
            }

            var callback = takeCallback(message.msgId);
            if (callback) {
              var handler = message.isSuccessful ? callback.onsuccess : callback.onerror;
              if (handler) {
                handler.call(null, message);
              }
            }
          };

          if (window.ReactNativeWebView) {
            /** android */
            document.addEventListener('message', listener);
            /** ios */
            window.addEventListener('message', listener);
          }
        };

        init();
      })();
    </script>
